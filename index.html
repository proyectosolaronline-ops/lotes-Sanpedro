<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2A4A;--ink-soft:#334268;--paper:#F5F3EE;--paper-line:#E4E0D6;--ochre:#C89B3C;--ok:#3E7A4C;--danger:#B3403C;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);padding:16px;}

h1{font-family:'Fraunces',serif;font-size:1.3rem;margin:0 0 4px;}
.sub{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--ink-soft);margin-bottom:16px;}

.search-bar{margin-bottom:14px;}
.search-bar input{width:100%;padding:10px 12px;border:1px solid var(--paper-line);border-radius:8px;font-family:'Inter',sans-serif;font-size:.85rem;background:#fff;color:var(--ink);}
.search-bar input:focus{outline:none;border-color:var(--ochre);}

.user-card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:center;cursor:pointer;}
.user-card img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--paper-line);flex-shrink:0;}
.user-info{flex:1;min-width:0;}
.user-info b{font-family:'Fraunces',serif;font-size:.9rem;display:block;}
.user-info small{color:var(--ink-soft);font-size:.7rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge{font-family:'JetBrains Mono',monospace;font-size:.6rem;padding:3px 8px;border-radius:10px;color:#fff;text-transform:uppercase;}
.badge.activo{background:var(--ok);}
.badge.inactivo{background:var(--danger);}

#overlay{position:fixed;inset:0;background:rgba(27,42,74,.55);z-index:100;display:none;align-items:flex-end;justify-content:center;}
#overlay.open{display:flex;}
#panel{background:#fff;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px;}
#panel h2{font-family:'Fraunces',serif;font-size:1.1rem;margin:0 0 14px;}
label{font-size:.7rem;color:var(--ink-soft);display:block;margin:8px 0 2px;text-transform:uppercase;letter-spacing:.5px;}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--paper-line);border-radius:5px;font-family:'Inter',sans-serif;font-size:.85rem;background:var(--paper);color:var(--ink);}
textarea{resize:vertical;min-height:55px;}
.row2{display:flex;gap:10px;}.row2>div{flex:1;}
#foto-preview{width:100%;height:110px;border-radius:8px;object-fit:cover;background:var(--paper-line);margin-top:8px;display:none;}
#foto-preview.show{display:block;}
.foto-botones{display:flex;gap:8px;margin-top:8px;}
.foto-botones label{flex:1;text-align:center;background:var(--ink);color:#fff;padding:9px;border-radius:5px;font-size:.75rem;cursor:pointer;margin:0;text-transform:none;letter-spacing:0;}
.foto-botones input[type=file]{display:none;}
#foto-estado{font-size:.65rem;color:var(--ink-soft);margin-top:4px;}
.panel-actions{display:flex;gap:10px;margin-top:16px;}
.btn{flex:1;padding:11px;border-radius:6px;border:none;font-size:.85rem;font-weight:500;cursor:pointer;}
.btn.primario{background:var(--ink);color:#fff;}
.btn.secundario{background:var(--paper);color:var(--ink);border:1px solid var(--paper-line);}
.btn.eliminar{background:var(--danger);color:#fff;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:.8rem;opacity:0;pointer-events:none;transition:opacity .3s;z-index:200;}
#toast.show{opacity:1;}
#vacio{text-align:center;color:var(--ink-soft);font-size:.85rem;padding:30px 0;display:none;}

.login-box{max-width:400px;margin:60px auto;background:#fff;padding:24px;border-radius:12px;border:1px solid var(--paper-line);text-align:center;}
.login-box input{width:100%;padding:10px;border:1px solid var(--paper-line);border-radius:6px;margin:8px 0;}
#login-error{color:var(--danger);font-size:.8rem;margin-top:8px;display:none;}
</style>
</head>
<body>

<!-- PANTALLA DE LOGIN (se muestra si no hay sesión) -->
<div id="login-screen" style="display:none;">
  <div class="login-box">
    <h2 style="font-family:'Fraunces',serif;">Acceso</h2>
    <p style="font-size:.85rem;color:var(--ink-soft);">Ingresa tu correo</p>
    <input type="email" id="login-correo" placeholder="correo@gmail.com">
    <input type="password" id="login-pass" placeholder="Contraseña (opcional)">
    <button class="btn primario" style="width:100%;margin-top:8px;" id="btn-login">Entrar</button>
    <p id="login-error">Correo no autorizado o inactivo</p>
    <p style="font-size:.7rem;color:var(--ink-soft);margin-top:12px;">
      ⚠️ El correo debe estar en la hoja "Usuario" con estado "Activo"
    </p>
  </div>
</div>

<!-- CONTENIDO PRINCIPAL (se muestra si hay sesión) -->
<div id="main-screen">
  <h1>Usuarios</h1>
  <p class="sub" id="sesion-info">Cargando...</p>

  <div class="search-bar">
    <input type="text" id="search-input" placeholder="🔍 Buscar usuario..." autocomplete="off">
  </div>

  <div id="lista"></div>
  <p id="vacio">No se encontraron usuarios.</p>
</div>

<!-- PANEL DE EDICIÓN -->
<div id="overlay">
  <div id="panel">
    <h2 id="panel-titulo">Editar usuario</h2>

    <label>Nombre</label>
    <input type="text" id="f-nombre" placeholder="Juan Pérez">

    <label>Correo</label>
    <input type="email" id="f-correo" disabled>

    <div class="row2">
      <div><label>Estado</label>
        <select id="f-estado"><option value="Activo">Activo</option><option value="Inactivo">Inactivo</option></select>
      </div>
      <div><label>Teléfono</label>
        <input type="tel" id="f-telefono" placeholder="6861234567">
      </div>
    </div>

    <label>Nombre del negocio</label>
    <input type="text" id="f-nombrenegocio" placeholder="Lotes del Valle">

    <label>Ubicación</label>
    <input type="text" id="f-ubicacion" placeholder="Mexicali, B.C.">

    <div class="row2">
      <div><label>Lat</label><input type="text" id="f-lat" placeholder="32.62476"></div>
      <div><label>Lng</label><input type="text" id="f-lng" placeholder="-115.45389"></div>
    </div>
    <button type="button" class="btn secundario" style="width:100%;margin-top:6px;" id="btn-mi-ubicacion">📍 Usar mi ubicación actual</button>

    <label>Descripción</label>
    <textarea id="f-descripcion" placeholder="Descripción..."></textarea>

    <label>Palabras clave</label>
    <input type="text" id="f-palabrasclave" placeholder="lotes, terrenos, venta">

    <label>Foto banner</label>
    <img id="foto-preview">
    <input type="hidden" id="f-fotobanner">
    <div class="foto-botones">
      <label>📷 Cámara<input type="file" accept="image/*" capture="environment" id="input-camara"></label>
      <label>🖼️ Galería<input type="file" accept="image/*" id="input-galeria"></label>
    </div>
    <p id="foto-estado"></p>

    <div class="panel-actions">
      <button type="button" class="btn secundario" id="btn-cancelar">Cancelar</button>
      <button type="button" class="btn primario" id="btn-guardar">Guardar</button>
    </div>
    <button type="button" class="btn eliminar" style="width:100%;margin-top:8px;" id="btn-eliminar">Eliminar usuario</button>
  </div>
</div>

<div id="toast"></div>

<script>
  // ========== CONFIGURACIÓN ==========
  // Cambia esta URL por la de tu Apps Script desplegado
  const API_URL = 'https://script.google.com/macros/s/AKfycbxH5cidRpXnHutg4V46IKI4ZEHcmETVk_ECMS9Fv-Zd48oifcrmtbyhTtudfN4mqlgx/exec';

  let CORREO_SESION = sessionStorage.getItem('correo_sesion') || null;
  let NOMBRE_SESION = sessionStorage.getItem('nombre_sesion') || null;
  let USUARIOS = [];
  let editandoCorreoOriginal = null;

  // ========== TOAST ==========
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ========== LOGIN / VERIFICACIÓN ==========
  async function verificarAcceso(correo){
    try {
      const resp = await fetch(API_URL + '?accion=verificar&correo=' + encodeURIComponent(correo));
      const data = await resp.json();
      return data;
    } catch(e){
      return { autorizado: false, nombre: null };
    }
  }

  document.getElementById('btn-login').addEventListener('click', async () => {
    const correo = document.getElementById('login-correo').value.trim().toLowerCase();
    if (!correo) { toast('Ingresa tu correo'); return; }

    const check = await verificarAcceso(correo);
    if (check.autorizado){
      CORREO_SESION = correo;
      NOMBRE_SESION = check.nombre;
      sessionStorage.setItem('correo_sesion', correo);
      sessionStorage.setItem('nombre_sesion', check.nombre || '');
      mostrarPantallaPrincipal();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  });

  function mostrarPantallaPrincipal(){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'block';
    document.getElementById('sesion-info').textContent = 
      'Sesión: ' + CORREO_SESION + (NOMBRE_SESION ? ' · ' + NOMBRE_SESION : '');
    cargarUsuarios();
  }

  // ========== CARGAR USUARIOS ==========
  async function cargarUsuarios(){
    try {
      const resp = await fetch(API_URL + '?accion=admin_usuarios&correo=' + encodeURIComponent(CORREO_SESION));
      const data = await resp.json();
      if (data.error) { toast('Error: ' + data.error); return; }
      USUARIOS = data || [];
      pintarLista(USUARIOS);
    } catch(e){
      toast('Error al cargar usuarios');
    }
  }

  function urlFoto(idOUrl){
    if (!idOUrl) return '';
    if (idOUrl.indexOf('http') === 0) return idOUrl;
    return 'https://drive.google.com/thumbnail?id=' + idOUrl;
  }

  function pintarLista(usuarios){
    const lista = document.getElementById('lista');
    const vacio = document.getElementById('vacio');
    lista.innerHTML = '';
    vacio.style.display = usuarios.length ? 'none' : 'block';

    usuarios.forEach(u => {
      const card = document.createElement('div');
      card.className = 'user-card';
      const activo = (u.estado || '').toLowerCase() === 'activo';
      card.innerHTML =
        '<img src="' + urlFoto(u.fotobanner) + '" onerror="this.style.display=\'none\'">' +
        '<div class="user-info"><b>' + (u.nombre || '(sin nombre)') + '</b>' +
        '<small>' + (u.correo || '') + '</small><small>' + (u.nombrenegocio || '') + '</small></div>' +
        '<span class="badge ' + (activo ? 'activo' : 'inactivo') + '">' + (u.estado || '-') + '</span>';
      card.addEventListener('click', () => abrirPanel(u));
      lista.appendChild(card);
    });
  }

  document.getElementById('search-input').addEventListener('input', e => {
    const q = e.target.value.toLowerCase().trim();
    if (!q) { pintarLista(USUARIOS); return; }
    pintarLista(USUARIOS.filter(u =>
      (u.nombre||'').toLowerCase().includes(q) ||
      (u.correo||'').toLowerCase().includes(q) ||
      (u.nombrenegocio||'').toLowerCase().includes(q)
    ));
  });

  // ========== ABRIR PANEL ==========
  function abrirPanel(u){
    document.getElementById('panel-titulo').textContent = 'Editar: ' + (u.nombre || 'Usuario');
    editandoCorreoOriginal = u.correo;
    document.getElementById('f-nombre').value = u.nombre || '';
    document.getElementById('f-correo').value = u.correo || '';
    document.getElementById('f-estado').value = u.estado || 'Activo';
    document.getElementById('f-telefono').value = u.telefono || '';
    document.getElementById('f-nombrenegocio').value = u.nombrenegocio || '';
    document.getElementById('f-ubicacion').value = u.ubicacion || '';
    document.getElementById('f-lat').value = u.lat || '';
    document.getElementById('f-lng').value = u.lng || '';
    document.getElementById('f-descripcion').value = u.descripcion || '';
    document.getElementById('f-palabrasclave').value = u.palabrasclave || '';
    document.getElementById('f-fotobanner').value = u.fotobanner || '';
    const preview = document.getElementById('foto-preview');
    if (u.fotobanner) { preview.src = urlFoto(u.fotobanner); preview.classList.add('show'); }
    else { preview.classList.remove('show'); preview.src = ''; }
    document.getElementById('foto-estado').textContent = '';
    document.getElementById('btn-eliminar').style.display = 'block';
    document.getElementById('overlay').classList.add('open');
  }

  function cerrarPanel(){
    document.getElementById('overlay').classList.remove('open');
    editandoCorreoOriginal = null;
  }

  document.getElementById('btn-cancelar').addEventListener('click', cerrarPanel);
  document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') cerrarPanel(); });

  // ========== FOTO ==========
  document.getElementById('input-camara').addEventListener('change', e => subirFoto(e.target.files[0]));
  document.getElementById('input-galeria').addEventListener('change', e => subirFoto(e.target.files[0]));

  async function subirFoto(file){
    if (!file) return;
    const preview = document.getElementById('foto-preview');
    const estado = document.getElementById('foto-estado');
    const reader = new FileReader();
    reader.onload = () => { preview.src = reader.result; preview.classList.add('show'); };
    reader.readAsDataURL(file);
    estado.textContent = 'Subiendo...';
    const base64 = await new Promise(resolve => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(',')[1]);
      r.readAsDataURL(file);
    });
    try {
      const resp = await fetch(API_URL + '?accion=subir_foto', {
        method: 'POST',
        body: JSON.stringify({ base64: base64, nombre: 'banner_' + Date.now() })
      });
      const data = await resp.json();
      if (data.id) { document.getElementById('f-fotobanner').value = data.id; estado.textContent = 'Foto lista ✓'; }
      else estado.textContent = 'Error al subir';
    } catch(e){ estado.textContent = 'Error de conexión'; }
  }

  // ========== UBICACIÓN ==========
  document.getElementById('btn-mi-ubicacion').addEventListener('click', () => {
    if (!navigator.geolocation) { toast('No soportado'); return; }
    navigator.geolocation.getCurrentPosition(
      p => { document.getElementById('f-lat').value = p.coords.latitude; document.getElementById('f-lng').value = p.coords.longitude; toast('Ubicación lista'); },
      () => toast('No se pudo obtener ubicación')
    );
  });

  // ========== GUARDAR ==========
  document.getElementById('btn-guardar').addEventListener('click', async () => {
    const payload = {
      correoSolicitante: CORREO_SESION,
      usuario: {
        nombre: document.getElementById('f-nombre').value.trim(),
        correo: editandoCorreoOriginal,
        estado: document.getElementById('f-estado').value,
        telefono: document.getElementById('f-telefono').value.trim(),
        nombrenegocio: document.getElementById('f-nombrenegocio').value.trim(),
        ubicacion: document.getElementById('f-ubicacion').value.trim(),
        lat: document.getElementById('f-lat').value.trim(),
        lng: document.getElementById('f-lng').value.trim(),
        descripcion: document.getElementById('f-descripcion').value.trim(),
        palabrasclave: document.getElementById('f-palabrasclave').value.trim(),
        fotobanner: document.getElementById('f-fotobanner').value.trim()
      }
    };
    try {
      const resp = await fetch(API_URL + '?accion=guardar_usuario', {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      if (data.result === 'success') { toast('Guardado ✓'); cerrarPanel(); cargarUsuarios(); }
      else toast('Error: ' + (data.error || 'desconocido'));
    } catch(e){ toast('Error de conexión'); }
  });

  // ========== ELIMINAR ==========
  document.getElementById('btn-eliminar').addEventListener('click', async () => {
    if (!editandoCorreoOriginal || !confirm('¿Eliminar a ' + editandoCorreoOriginal + '?')) return;
    try {
      const resp = await fetch(API_URL + '?accion=eliminar_usuario', {
        method: 'POST',
        body: JSON.stringify({ correoSolicitante: CORREO_SESION, correoObjetivo: editandoCorreoOriginal })
      });
      const data = await resp.json();
      if (data.result === 'success') { toast('Eliminado ✓'); cerrarPanel(); cargarUsuarios(); }
      else toast('Error: ' + (data.error || 'desconocido'));
    } catch(e){ toast('Error de conexión'); }
  });

  // ========== INICIAR ==========
  if (CORREO_SESION) {
    mostrarPantallaPrincipal();
  } else {
    document.getElementById('login-screen').style.display = 'block';
    document.getElementById('main-screen').style.display = 'none';
  }
</script>

</body>
</html>
