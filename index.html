<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin · Usuarios</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2A4A;--ink-soft:#334268;--paper:#F5F3EE;--paper-line:#E4E0D6;--ochre:#C89B3C;--ok:#3E7A4C;--danger:#B3403C;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);padding:16px;padding-bottom:80px;}
h1{font-family:'Fraunces',serif;font-size:1.3rem;margin:0 0 16px;}

#lista{display:flex;flex-direction:column;gap:8px;}

.user-card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;}
.user-card img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--paper-line);flex-shrink:0;}
.user-info{flex:1;min-width:0;}
.user-info b{font-family:'Fraunces',serif;font-size:.9rem;display:block;}
.user-info small{color:var(--ink-soft);font-size:.7rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge{font-family:'JetBrains Mono',monospace;font-size:.6rem;padding:3px 8px;border-radius:10px;color:#fff;text-transform:uppercase;flex-shrink:0;}
.badge.activo{background:var(--ok);}
.badge.inactivo{background:var(--danger);}

#btn-nuevo{position:fixed;bottom:20px;right:20px;z-index:50;background:var(--ink);color:#fff;border:none;border-radius:50%;width:56px;height:56px;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);}

#overlay{position:fixed;inset:0;background:rgba(27,42,74,.55);z-index:100;display:none;align-items:flex-end;justify-content:center;}
#overlay.open{display:flex;}
#panel{background:#fff;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px;}
#panel h2{font-family:'Fraunces',serif;font-size:1.1rem;margin:0 0 14px;}
label{font-size:.72rem;color:var(--ink-soft);display:block;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px;}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--paper-line);border-radius:5px;font-family:'Inter',sans-serif;font-size:.9rem;background:var(--paper);color:var(--ink);}
textarea{resize:vertical;min-height:60px;}
.row2{display:flex;gap:10px;}
.row2>div{flex:1;}
#foto-preview{width:100%;height:120px;border-radius:8px;object-fit:cover;background:var(--paper-line);margin-top:8px;display:none;}
#foto-preview.show{display:block;}
.foto-botones{display:flex;gap:8px;margin-top:8px;}
.foto-botones label{flex:1;text-align:center;background:var(--ink);color:#fff;padding:9px;border-radius:5px;font-size:.78rem;cursor:pointer;margin:0;text-transform:none;letter-spacing:0;}
.foto-botones input[type=file]{display:none;}
#foto-estado{font-size:.7rem;color:var(--ink-soft);margin-top:4px;}
.panel-actions{display:flex;gap:10px;margin-top:18px;}
.btn{flex:1;padding:11px;border-radius:6px;border:none;font-size:.85rem;font-weight:500;cursor:pointer;}
.btn.primario{background:var(--ink);color:#fff;}
.btn.secundario{background:var(--paper);color:var(--ink);border:1px solid var(--paper-line);}
.btn.eliminar{background:var(--danger);color:#fff;}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:.8rem;opacity:0;pointer-events:none;transition:opacity .3s;z-index:200;}
#toast.show{opacity:1;}
#vacio{text-align:center;color:var(--ink-soft);font-size:.85rem;padding:30px 0;display:none;}
</style>
</head>
<body>

<h1>Usuarios</h1>

<div id="lista"></div>
<p id="vacio">No hay usuarios registrados.</p>

<button id="btn-nuevo" title="Nuevo usuario">+</button>

<div id="overlay">
  <div id="panel">
    <h2 id="panel-titulo">Nuevo usuario</h2>
    <input type="hidden" id="f-correo-original">

    <label>Nombre</label>
    <input type="text" id="f-nombre" placeholder="Juan Pérez">

    <label>Correo</label>
    <input type="email" id="f-correo" placeholder="correo@gmail.com">

    <div class="row2">
      <div><label>Estado</label>
        <select id="f-estado"><option value="Activo">Activo</option><option value="Inactivo">Inactivo</option></select>
      </div>
      <div><label>Teléfono</label>
        <input type="tel" id="f-telefono" placeholder="6861234567">
      </div>
    </div>

    <label>Nombre del negocio</label>
    <input type="text" id="f-nombrenegocio" placeholder="Lotes del Valle">

    <label>Ubicación</label>
    <input type="text" id="f-ubicacion" placeholder="Mexicali, B.C.">

    <div class="row2">
      <div><label>Lat</label><input type="text" id="f-lat" placeholder="32.62476"></div>
      <div><label>Lng</label><input type="text" id="f-lng" placeholder="-115.45389"></div>
    </div>
    <button type="button" class="btn secundario" style="width:100%;margin-top:8px;" id="btn-mi-ubicacion">📍 Usar mi ubicación actual</button>

    <label>Descripción</label>
    <textarea id="f-descripcion" placeholder="Venta de lotes residenciales..."></textarea>

    <label>Palabras clave</label>
    <input type="text" id="f-palabrasclave" placeholder="lotes, terrenos, venta">

    <label>Foto del banner</label>
    <img id="foto-preview">
    <input type="hidden" id="f-fotobanner">
    <div class="foto-botones">
      <label>📷 Cámara<input type="file" accept="image/*" capture="environment" id="input-camara"></label>
      <label>🖼️ Galería<input type="file" accept="image/*" id="input-galeria"></label>
    </div>
    <p id="foto-estado"></p>

    <div class="panel-actions">
      <button type="button" class="btn secundario" id="btn-cancelar">Cancelar</button>
      <button type="button" class="btn primario" id="btn-guardar">Guardar</button>
    </div>
    <button type="button" class="btn eliminar" style="width:100%;margin-top:10px;display:none;" id="btn-eliminar">Eliminar usuario</button>
  </div>
</div>

<div id="toast"></div>

<script>
  let USUARIOS = [];
  let editandoCorreoOriginal = null;

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function cargarUsuarios(){
    google.script.run
      .withSuccessHandler(usuarios => {
        USUARIOS = usuarios || [];
        pintarLista();
      })
      .withFailureHandler(err => toast('Error: ' + err.message))
      .obtenerUsuariosAdmin();
  }

  function urlFoto(idOUrl){
    if (!idOUrl) return '';
    if (idOUrl.indexOf('http') === 0) return idOUrl;
    return 'https://drive.google.com/thumbnail?id=' + idOUrl;
  }

  function pintarLista(){
    const lista = document.getElementById('lista');
    const vacio = document.getElementById('vacio');
    lista.innerHTML = '';
    vacio.style.display = USUARIOS.length ? 'none' : 'block';

    USUARIOS.forEach(u => {
      const card = document.createElement('div');
      card.className = 'user-card';
      const activo = (u.estado || '').toLowerCase() === 'activo';
      card.innerHTML =
        '<img src="' + urlFoto(u.fotobanner) + '" onerror="this.style.display=\'none\'">' +
        '<div class="user-info"><b>' + (u.nombre || '(sin nombre)') + '</b>' +
        '<small>' + (u.correo || '') + '</small><small>' + (u.nombrenegocio || '') + '</small></div>' +
        '<span class="badge ' + (activo ? 'activo' : 'inactivo') + '">' + (u.estado || '-') + '</span>';
      card.addEventListener('click', () => abrirPanel(u));
      lista.appendChild(card);
    });
  }

  function abrirPanel(usuario){
    document.getElementById('panel-titulo').textContent = usuario ? 'Editar usuario' : 'Nuevo usuario';
    editandoCorreoOriginal = usuario ? usuario.correo : null;
    document.getElementById('f-nombre').value = usuario ? (usuario.nombre || '') : '';
    document.getElementById('f-correo').value = usuario ? (usuario.correo || '') : '';
    document.getElementById('f-correo').disabled = !!usuario;
    document.getElementById('f-estado').value = usuario ? (usuario.estado || 'Activo') : 'Activo';
    document.getElementById('f-telefono').value = usuario ? (usuario.telefono || '') : '';
    document.getElementById('f-nombrenegocio').value = usuario ? (usuario.nombrenegocio || '') : '';
    document.getElementById('f-ubicacion').value = usuario ? (usuario.ubicacion || '') : '';
    document.getElementById('f-lat').value = usuario ? (usuario.lat || '') : '';
    document.getElementById('f-lng').value = usuario ? (usuario.lng || '') : '';
    document.getElementById('f-descripcion').value = usuario ? (usuario.descripcion || '') : '';
    document.getElementById('f-palabrasclave').value = usuario ? (usuario.palabrasclave || '') : '';
    document.getElementById('f-fotobanner').value = usuario ? (usuario.fotobanner || '') : '';
    const preview = document.getElementById('foto-preview');
    if (usuario && usuario.fotobanner) {
      preview.src = urlFoto(usuario.fotobanner);
      preview.classList.add('show');
    } else {
      preview.classList.remove('show');
      preview.src = '';
    }
    document.getElementById('foto-estado').textContent = '';
    document.getElementById('btn-eliminar').style.display = usuario ? 'block' : 'none';
    document.getElementById('overlay').classList.add('open');
  }

  function cerrarPanel(){
    document.getElementById('overlay').classList.remove('open');
  }

  document.getElementById('btn-nuevo').addEventListener('click', () => abrirPanel(null));
  document.getElementById('btn-cancelar').addEventListener('click', cerrarPanel);
  document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') cerrarPanel(); });

  function manejarArchivo(file){
    if (!file) return;
    const preview = document.getElementById('foto-preview');
    const estado = document.getElementById('foto-estado');
    const reader = new FileReader();
    reader.onload = () => { preview.src = reader.result; preview.classList.add('show'); };
    reader.readAsDataURL(file);
    estado.textContent = 'Subiendo foto...';
    const readerB64 = new FileReader();
    readerB64.onload = () => {
      google.script.run
        .withSuccessHandler(id => {
          if (id) { document.getElementById('f-fotobanner').value = id; estado.textContent = 'Foto lista ✓'; }
          else estado.textContent = 'Error al subir.';
        })
        .withFailureHandler(err => { estado.textContent = 'Error: ' + err.message; })
        .subirFotoBase64(readerB64.result.split(',')[1], 'banner_' + Date.now());
    };
    readerB64.readAsDataURL(file);
  }

  document.getElementById('input-camara').addEventListener('change', e => manejarArchivo(e.target.files[0]));
  document.getElementById('input-galeria').addEventListener('change', e => manejarArchivo(e.target.files[0]));

  document.getElementById('btn-mi-ubicacion').addEventListener('click', () => {
    if (!navigator.geolocation) { toast('No soportado'); return; }
    navigator.geolocation.getCurrentPosition(
      p => { document.getElementById('f-lat').value = p.coords.latitude; document.getElementById('f-lng').value = p.coords.longitude; toast('Ubicación capturada ✓'); },
      () => toast('No se pudo obtener ubicación.')
    );
  });

  document.getElementById('btn-guardar').addEventListener('click', () => {
    const correo = document.getElementById('f-correo').value.trim();
    if (!correo) { toast('El correo es obligatorio.'); return; }
    const payload = {
      nombre: document.getElementById('f-nombre').value.trim(),
      correo: editandoCorreoOriginal || correo,
      estado: document.getElementById('f-estado').value,
      telefono: document.getElementById('f-telefono').value.trim(),
      nombrenegocio: document.getElementById('f-nombrenegocio').value.trim(),
      ubicacion: document.getElementById('f-ubicacion').value.trim(),
      lat: document.getElementById('f-lat').value.trim(),
      lng: document.getElementById('f-lng').value.trim(),
      descripcion: document.getElementById('f-descripcion').value.trim(),
      palabrasclave: document.getElementById('f-palabrasclave').value.trim(),
      fotobanner: document.getElementById('f-fotobanner').value.trim()
    };
    google.script.run
      .withSuccessHandler(() => { toast('Usuario guardado ✓'); cerrarPanel(); cargarUsuarios(); })
      .withFailureHandler(err => toast('Error: ' + err.message))
      .guardarUsuario(payload);
  });

  document.getElementById('btn-eliminar').addEventListener('click', () => {
    if (!editandoCorreoOriginal || !confirm('¿Eliminar a ' + editandoCorreoOriginal + '?')) return;
    google.script.run
      .withSuccessHandler(() => { toast('Usuario eliminado ✓'); cerrarPanel(); cargarUsuarios(); })
      .withFailureHandler(err => toast('Error: ' + err.message))
      .eliminarUsuario(editandoCorreoOriginal);
  });

  cargarUsuarios();
</script>

</body>
</html>
