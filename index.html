<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A; --ink-soft:#334268; --paper:#F5F3EE; --paper-line:#E4E0D6;
    --ochre:#C89B3C; --ok:#3E7A4C; --sold:#8A2B2B; --held:#B8842B; --legal:#5B4B8A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter', sans-serif; background:var(--paper); color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  
  /* ====== LOGIN ====== */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  #login-screen.hidden { display: none; }
  .login-box {
    background: #fff; border: 2px solid var(--ink); border-radius: 8px;
    padding: 30px 24px; width: 100%; max-width: 380px; text-align: center;
  }
  .login-box h2 {
    font-family: 'Fraunces', serif; font-size: 1.2rem; margin: 0 0 6px;
  }
  .login-box p { font-size: .8rem; color: var(--ink-soft); margin: 0 0 20px; }
  .login-box label {
    display: block; text-align: left; font-size: .68rem; text-transform: uppercase;
    letter-spacing: .6px; color: var(--ink-soft); margin: 10px 0 4px; font-weight: 600;
  }
  .login-box input {
    width: 100%; padding: 12px; border: 1px solid var(--paper-line); border-radius: 4px;
    font-family: 'Inter', sans-serif; font-size: 1rem; background: var(--paper); color: var(--ink);
    text-align: center; letter-spacing: 2px;
  }
  .login-box input:focus { outline: 2px solid var(--ochre); background: #fff; }
  .login-box button {
    width: 100%; padding: 14px; margin-top: 16px; background: var(--ink); color: var(--paper);
    border: none; border-radius: 4px; font-family: 'JetBrains Mono', monospace;
    font-size: .82rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
  }
  .login-box button:hover { background: var(--ochre); color: var(--ink); }
  .login-box button:disabled { opacity: .5; cursor: wait; }
  .login-msg { margin-top: 12px; font-size: .74rem; font-family: 'JetBrains Mono', monospace; min-height: 1.2em; }
  #paso-email { display: block; }
  #paso-codigo { display: none; }
  
  /* ====== PANEL ====== */
  #panel-screen { display: none; }
  #panel-screen.visible { display: block; }
  
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:12px 16px; border-bottom:2px solid var(--ink); background:var(--paper);
    flex-wrap:wrap; gap:6px;
  }
  header h1{ font-family:'Fraunces', serif; font-size:1.05rem; font-weight:700; margin:0; }
  header .stamp{
    font-family:'JetBrains Mono', monospace; font-size:.62rem; color:var(--ink-soft);
    border:1px solid var(--ink-soft); padding:3px 8px; border-radius:2px;
    text-transform:uppercase; letter-spacing:1px; white-space:nowrap;
  }
  .tabs{
    display:flex; border-bottom:1px solid var(--paper-line); overflow-x:auto;
    background:var(--paper); position:sticky; top:0; z-index:999;
  }
  .tabs button{
    flex:1; min-width:80px; padding:12px 10px; background:none; border:none;
    font-family:'JetBrains Mono', monospace; font-size:.65rem; letter-spacing:.5px;
    text-transform:uppercase; cursor:pointer; color:var(--ink-soft);
    border-bottom:2px solid transparent; white-space:nowrap;
  }
  .tabs button.active{ color:var(--ink); border-bottom-color:var(--ochre); font-weight:700; }
  .tab-content{ display:none; }
  .tab-content.active{ display:block; }
  .layout{ display:flex; flex-direction:column; min-height:calc(100vh - 100px); }
  #map{ height:45vh; min-height:280px; width:100%; border-bottom:2px solid var(--ink); }
  .panel{ padding:14px; overflow-y:auto; flex:1; }
  .card{
    background:#fff; border:1px solid var(--paper-line); border-radius:4px;
    padding:14px 16px; margin-bottom:14px; position:relative;
  }
  .card::before{
    content:attr(data-tag); position:absolute; top:-10px; left:12px;
    background:var(--ink); color:var(--paper); font-family:'JetBrains Mono', monospace;
    font-size:.6rem; letter-spacing:1px; padding:2px 7px; border-radius:2px;
  }
  .coords{ display:flex; gap:8px; font-family:'JetBrains Mono', monospace; }
  .coords .box{
    flex:1; background:var(--ink); color:#B7F0C4; padding:8px 10px;
    border-radius:3px; font-size:.8rem; display:flex; flex-direction:column; gap:2px;
  }
  .coords .box span{ font-size:.55rem; color:#8FA8C7; letter-spacing:1px; text-transform:uppercase; }
  .hint{ font-size:.7rem; color:var(--ink-soft); margin:6px 0 0; font-style:italic; }
  label{
    display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.6px;
    color:var(--ink-soft); margin:10px 0 4px; font-weight:600;
  }
  input[type=text], input[type=number], select{
    width:100%; padding:10px 12px; border:1px solid var(--paper-line); border-radius:3px;
    font-family:'Inter', sans-serif; font-size:1rem; background:var(--paper); color:var(--ink);
    -webkit-appearance:none;
  }
  input:focus, select:focus{ outline:2px solid var(--ochre); outline-offset:1px; background:#fff; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button{
    margin-top:14px; width:100%; padding:14px; background:var(--ink); color:var(--paper);
    border:none; border-radius:3px; font-family:'JetBrains Mono', monospace; font-size:.82rem;
    letter-spacing:1px; text-transform:uppercase; cursor:pointer;
  }
  button:hover{ background:var(--ochre); color:var(--ink); }
  button:disabled{ opacity:.5; cursor:wait; }
  .btn-outline{ background:var(--paper); color:var(--ink); border:1px solid var(--ink); margin-top:8px; }
  .btn-outline:hover{ background:var(--ink); color:var(--paper); }
  #status-msg{ margin-top:8px; font-size:.74rem; font-family:'JetBrains Mono', monospace; min-height:1.1em; }
  .foto-preview{ max-width:100%; max-height:160px; border-radius:4px; margin-top:8px; display:none; }
  textarea{ width:100%; height:200px; padding:12px; border:1px solid var(--paper-line); border-radius:3px; font-family:'JetBrains Mono', monospace; font-size:.65rem; background:#fff; color:var(--ink); resize:vertical; display:none; }
  @media (min-width:768px){
    header{ padding:14px 20px; }
    header h1{ font-size:1.25rem; }
    .layout{ display:grid; grid-template-columns:1.4fr 1fr; min-height:calc(100vh - 60px); }
    #map{ height:100%; min-height:480px; border-right:2px solid var(--ink); border-bottom:none; }
    .panel{ padding:22px 24px 40px; max-height:calc(100vh - 60px); }
    .card{ padding:18px 20px; margin-bottom:20px; }
    .coords .box{ padding:10px 12px; font-size:.9rem; }
    input[type=text], input[type=number], select{ font-size:.9rem; }
    textarea{ height:300px; }
  }
</style>
</head>
<body>

<!-- ====== LOGIN SCREEN ====== -->
<div id="login-screen">
  <div class="login-box">
    <h2>🏗️ Panel Admin</h2>
    <p>Ingresa con tu correo autorizado</p>
    
    <div id="paso-email">
      <label for="login-email">Correo electrónico</label>
      <input type="text" id="login-email" placeholder="tu@correo.com" inputmode="email" autocomplete="email">
      <button id="btn-solicitar-codigo">Enviar código</button>
      <div class="login-msg" id="login-msg-email"></div>
    </div>
    
    <div id="paso-codigo">
      <label for="login-codigo">Código de verificación</label>
      <input type="text" id="login-codigo" placeholder="000000" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
      <button id="btn-verificar-codigo">Verificar</button>
      <button id="btn-reenviar" class="btn-outline" style="margin-top:8px;">Reenviar código</button>
      <div class="login-msg" id="login-msg-codigo"></div>
    </div>
  </div>
</div>

<!-- ====== PANEL SCREEN ====== -->
<div id="panel-screen">

<header>
  <h1>🏗️ Panel Admin · Lotes</h1>
  <span class="stamp">Admin</span>
</header>

<div class="tabs">
  <button class="active" data-tab="tab-registrar">📝 Registrar Lote</button>
  <button data-tab="tab-visor">🌐 Generar Visor</button>
</div>

<div id="tab-registrar" class="tab-content active">
  <div class="layout">
    <div id="map"></div>
    <div class="panel">
      <div class="card" data-tag="Ubicación">
        <div class="coords">
          <div class="box"><span>Latitud</span><b id="lat-display">—</b></div>
          <div class="box"><span>Longitud</span><b id="lng-display">—</b></div>
        </div>
        <p class="hint">Toca el mapa o escribe coordenadas.</p>
        <div class="row2">
          <div><label for="lat-input">Latitud</label><input type="text" id="lat-input" placeholder="32.62476" inputmode="decimal"></div>
          <div><label for="lng-input">Longitud</label><input type="text" id="lng-input" placeholder="-115.45389" inputmode="decimal"></div>
        </div>
      </div>
      <div class="card" data-tag="Ficha del Lote">
        <label for="codigolote">Código</label><input type="text" id="codigolote" placeholder="LOTE-001">
        <div class="row2">
          <div><label for="tipopago">Pago</label><select id="tipopago"><option>Contado</option><option>Crédito</option><option>Financiamiento</option></select></div>
          <div><label for="estado">Estado</label><select id="estado"><option>Disponible</option><option>Apartado</option><option>Vendido</option><option>En juridico</option></select></div>
        </div>
        <div class="row2">
          <div><label for="valor">Valor ($)</label><input type="number" id="valor" placeholder="450000"></div>
          <div><label for="metros">m²</label><input type="number" id="metros" placeholder="120"></div>
        </div>
        <label for="medida">Medida</label><input type="text" id="medida" placeholder="8m x 15m">
        <label for="fotolote">Foto del lote</label><input type="file" id="fotolote" accept="image/*" capture="environment" style="padding:8px;">
        <img id="preview-lote" class="foto-preview">
        <button id="btn-guardar">💾 Guardar lote</button>
        <div id="status-msg"></div>
      </div>
    </div>
  </div>
</div>

<div id="tab-visor" class="tab-content">
  <div class="panel">
    <div class="card" data-tag="Visor HTML para GitHub">
      <p class="hint" style="margin-bottom:12px;">Genera el archivo <strong>index.html</strong> listo para publicar en <strong>GitHub Pages</strong>.</p>
      <button id="btn-generar-visor">🔄 Generar Visor HTML</button>
      <button id="btn-descargar" class="btn-outline" style="display:none;">💾 Descargar index.html</button>
      <textarea id="visor-output" readonly></textarea>
      <p id="visor-msg" class="hint"></p>
    </div>
  </div>
</div>

</div><!-- /panel-screen -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  // ====== LOGIN ======
  var loginEmail = '';
  
  document.getElementById('btn-solicitar-codigo').addEventListener('click', function() {
    var email = document.getElementById('login-email').value.trim();
    var msg = document.getElementById('login-msg-email');
    
    if (!email || email.indexOf('@') === -1) {
      msg.style.color = '#8A2B2B'; msg.textContent = 'Ingresa un correo válido.'; return;
    }
    
    this.disabled = true;
    msg.style.color = '#334268'; msg.textContent = '⏳ Enviando...';
    
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          loginEmail = email;
          document.getElementById('paso-email').style.display = 'none';
          document.getElementById('paso-codigo').style.display = 'block';
          document.getElementById('login-msg-codigo').textContent = '';
          document.getElementById('login-codigo').focus();
        } else {
          msg.style.color = '#8A2B2B'; msg.textContent = '❌ ' + res.error;
        }
        document.getElementById('btn-solicitar-codigo').disabled = false;
      })
      .withFailureHandler(function(err) {
        msg.style.color = '#8A2B2B'; msg.textContent = '❌ Error: ' + err.message;
        document.getElementById('btn-solicitar-codigo').disabled = false;
      })
      .solicitarCodigoAcceso(email);
  });

  document.getElementById('btn-verificar-codigo').addEventListener('click', function() {
    var codigo = document.getElementById('login-codigo').value.trim();
    var msg = document.getElementById('login-msg-codigo');
    
    if (!codigo || codigo.length !== 6) {
      msg.style.color = '#8A2B2B'; msg.textContent = 'Ingresa el código de 6 dígitos.'; return;
    }
    
    this.disabled = true;
    msg.style.color = '#334268'; msg.textContent = '⏳ Verificando...';
    
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.autorizado) {
          document.getElementById('login-screen').classList.add('hidden');
          document.getElementById('panel-screen').classList.add('visible');
          initPanel();
        } else {
          msg.style.color = '#8A2B2B'; msg.textContent = '❌ ' + res.error;
        }
        document.getElementById('btn-verificar-codigo').disabled = false;
      })
      .withFailureHandler(function(err) {
        msg.style.color = '#8A2B2B'; msg.textContent = '❌ Error: ' + err.message;
        document.getElementById('btn-verificar-codigo').disabled = false;
      })
      .verificarCodigoAcceso(loginEmail, codigo);
  });

  document.getElementById('btn-reenviar').addEventListener('click', function() {
    document.getElementById('paso-email').style.display = 'block';
    document.getElementById('paso-codigo').style.display = 'none';
    document.getElementById('login-msg-email').textContent = '';
  });

  // Enter key en campo código
  document.getElementById('login-codigo').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('btn-verificar-codigo').click();
  });
  document.getElementById('login-email').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('btn-solicitar-codigo').click();
  });

  // ====== PANEL ======
  function initPanel() {
    // TABS
    document.querySelectorAll('.tabs button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tabs button').forEach(function(b) { b.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
        document.getElementById(this.getAttribute('data-tab')).classList.add('active');
        if(this.getAttribute('data-tab') === 'tab-registrar' && window._map) window._map.invalidateSize();
      });
    });

    // MAPA
    var map = L.map('map', { tap: true }).setView([32.62476, -115.45389], 12);
    window._map = map;
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
    }).addTo(map);

    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        function(p) { map.setView([p.coords.latitude, p.coords.longitude], 12); },
        function() {},
        { enableHighAccuracy: true, timeout: 5000 }
      );
    }

    var marker = null, pendingLatLng = null;
    var latInput = document.getElementById('lat-input');
    var lngInput = document.getElementById('lng-input');
    var latDisplay = document.getElementById('lat-display');
    var lngDisplay = document.getElementById('lng-display');

    function setMarker(lat, lng, panTo) {
      lat = parseFloat(lat); lng = parseFloat(lng);
      if(isNaN(lat) || isNaN(lng)) return;
      if(marker) { marker.setLatLng([lat, lng]); }
      else {
        marker = L.marker([lat, lng], { draggable: true }).addTo(map);
        marker.on('drag', function(e) {
          latDisplay.textContent = e.target.getLatLng().lat.toFixed(6);
          lngDisplay.textContent = e.target.getLatLng().lng.toFixed(6);
          latInput.value = e.target.getLatLng().lat.toFixed(6);
          lngInput.value = e.target.getLatLng().lng.toFixed(6);
        });
      }
      if(panTo) map.setView([lat, lng], Math.max(map.getZoom(), 15));
      latDisplay.textContent = lat.toFixed(6);
      lngDisplay.textContent = lng.toFixed(6);
      latInput.value = lat.toFixed(6);
      lngInput.value = lng.toFixed(6);
    }

    map.on('click', function(e) {
      pendingLatLng = e.latlng;
      L.popup({ closeButton: false, autoClose: true, closeOnClick: false })
        .setLatLng(e.latlng)
        .setContent('<div style="text-align:center;padding:4px;"><p style="margin:0 0 8px;font-weight:600;">¿Colocar lote aquí?</p><button onclick="window.__ok()" style="padding:6px 12px;margin-right:4px;background:#1B2A4A;color:#fff;border:none;border-radius:3px;cursor:pointer;">✅ Sí</button><button onclick="window.__no()" style="padding:6px 12px;background:#fff;border:1px solid #1B2A4A;border-radius:3px;cursor:pointer;">❌ No</button></div>')
        .openOn(map);
    });
    window.__ok = function() { if(pendingLatLng) setMarker(pendingLatLng.lat, pendingLatLng.lng, false); map.closePopup(); };
    window.__no = function() { map.closePopup(); };

    [latInput, lngInput].forEach(function(el) {
      el.addEventListener('change', function() {
        if(latInput.value && lngInput.value) setMarker(latInput.value, lngInput.value, true);
      });
    });

    function colorEstado(e) {
      switch((e||'').toLowerCase()) {
        case 'disponible': return '#3E7A4C';
        case 'vendido': return '#8A2B2B';
        case 'apartado': return '#B8842B';
        case 'en juridico': return '#5B4B8A';
        default: return '#334268';
      }
    }

    var lotesLayer = L.layerGroup().addTo(map);
    function pintarLotes(lotes) {
      lotesLayer.clearLayers();
      lotes.forEach(function(l) {
        var lat = parseFloat(l.lat), lng = parseFloat(l.lng);
        if(isNaN(lat) || isNaN(lng)) return;
        var pop = '<span style="font-family:JetBrains Mono;font-size:.65rem;color:#C89B3C;font-weight:700;">#'+(l.idHoja1||'')+'</span><br><b>'+(l.codigolote||'Sin nombre')+'</b><br>Estado: '+(l.estado||'-')+'<br>Pago: '+(l.tipopago||'-')+'<br>Valor: $'+(l.valor||'-')+'<br>'+(l.metros||'-')+' m² · '+(l.medida||'-');
        if(l.fotolote) pop += '<br><img src="https://drive.google.com/thumbnail?id='+l.fotolote+'" style="width:100%;max-width:200px;border-radius:4px;margin-top:6px;">';
        L.circleMarker([lat,lng], { radius:8, color:'#1B2A4A', weight:1.5, fillColor:colorEstado(l.estado), fillOpacity:.9 }).addTo(lotesLayer).bindPopup(pop);
      });
    }
    google.script.run.withSuccessHandler(pintarLotes).obtenerLotes();

    // FOTO
    var fotoLoteBase64 = '';
    document.getElementById('fotolote').addEventListener('change', function() {
      var file = this.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        fotoLoteBase64 = e.target.result.split(',')[1];
        document.getElementById('preview-lote').src = e.target.result;
        document.getElementById('preview-lote').style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    // GUARDAR LOTE
    document.getElementById('btn-guardar').addEventListener('click', function() {
      var s = document.getElementById('status-msg');
      if(!latInput.value || !lngInput.value) { s.textContent='⚠️ Falta ubicación.'; s.style.color='#8A2B2B'; return; }
      this.disabled = true;
      s.style.color='#334268'; s.textContent='⏳ Guardando...';

      function guardar(fotoId) {
        google.script.run
          .withSuccessHandler(function(res) {
            s.style.color='#3E7A4C'; s.textContent='✅ #'+res.idHoja1+' '+res.codigo+' guardado.';
            document.getElementById('btn-guardar').disabled = false;
            document.getElementById('codigolote').value = '';
            document.getElementById('preview-lote').style.display = 'none';
            document.getElementById('fotolote').value = '';
            fotoLoteBase64 = '';
            google.script.run.withSuccessHandler(pintarLotes).obtenerLotes();
          })
          .withFailureHandler(function(err) {
            s.style.color='#8A2B2B'; s.textContent='❌ '+err.message;
            document.getElementById('btn-guardar').disabled = false;
          })
          .guardarLote({
            codigolote: document.getElementById('codigolote').value.trim(),
            tipopago: document.getElementById('tipopago').value,
            estado: document.getElementById('estado').value,
            valor: document.getElementById('valor').value,
            metros: document.getElementById('metros').value,
            medida: document.getElementById('medida').value.trim(),
            lat: latInput.value,
            lng: lngInput.value,
            fotolote: fotoId || ''
          });
      }

      if(fotoLoteBase64) {
        google.script.run.withSuccessHandler(guardar).subirFotoBase64(fotoLoteBase64, 'lote_'+Date.now());
      } else {
        guardar('');
      }
    });

    // GENERAR VISOR
    var visorHTML = '';

    document.getElementById('btn-generar-visor').addEventListener('click', function() {
      var btn = this;
      var msg = document.getElementById('visor-msg');
      btn.disabled = true; btn.textContent = '⏳ Generando...';
      
      google.script.run
        .withSuccessHandler(function(negocio) {
          google.script.run
            .withSuccessHandler(function(lotes) {
              visorHTML = generarVisor(negocio, lotes);
              document.getElementById('visor-output').value = visorHTML;
              document.getElementById('visor-output').style.display = 'block';
              document.getElementById('btn-descargar').style.display = 'block';
              msg.textContent = '✅ Listo. Descarga el archivo.';
              msg.style.color = '#3E7A4C';
              btn.disabled = false; btn.textContent = '🔄 Generar Visor HTML';
            })
            .withFailureHandler(function(e) { msg.textContent = '❌ '+e.message; btn.disabled = false; btn.textContent = '🔄 Generar Visor HTML'; })
            .obtenerLotes();
        })
        .withFailureHandler(function(e) { msg.textContent = '❌ '+e.message; btn.disabled = false; btn.textContent = '🔄 Generar Visor HTML'; })
        .obtenerDatosNegocio();
    });

    document.getElementById('btn-descargar').addEventListener('click', function() {
      if(!visorHTML) return;

"><h1>'+negocio.nombrenegocio+'</h1><span id="lote-count">'+disponibles.length+' lotes</span></div>\n<div class="fabs">\n<button class="fab" id="btn-gps">📍</button>\n<a class="fab whats" id="btn-whats" target="_blank">💬</a>\n</div>\n<div id="drawer">\n<div id="drawer-handle"><b>Lotes</b><span id="drawer-count">'+disponibles.length+'</span></div>\n<div id="drawer-body">\n<input type="text" id="buscador" placeholder="Buscar lote...">\n<div id="lista"></div>\n</div>\n</div>\n<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"><\/script>\n<script>\nvar LOTES='+lotesJSON+';\nvar map=L.map("map").setView(['+clat+','+clng+'],12);\nL.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);\nL.marker(['+negocio.lat+','+negocio.lng+']).addTo(map).bindPopup("<b>'+nom+'</b><br>'+ubi+'");\nnavigator.geolocation&&navigator.geolocation.getCurrentPosition(function(p){map.setView([p.coords.latitude,p.coords.longitude],15);L.circleMarker([p.coords.latitude,p.coords.longitude],{radius:8,color:"#C89B3C",fillOpacity:1}).addTo(map).bindPopup("📍 Tú");});\ndocument.getElementById("btn-gps").addEventListener("click",function(){navigator.geolocation&&navigator.geolocation.getCurrentPosition(function(p){map.setView([p.coords.latitude,p.coords.longitude],15);});});\ndocument.getElementById("btn-whats").href="https://wa.me/52'+tel+'?text=Hola, vi sus lotes";\nvar lotesLayer=L.layerGroup().addTo(map);\nvar marcadores={};\nfunction render(){var t=document.getElementById("buscador").value.toLowerCase();lotesLayer.clearLayers();marcadores={};var v=LOTES.filter(function(l){return!t||(l.codigolote||"").toLowerCase().includes(t)||String(l.idHoja1||"").includes(t);});\ndocument.getElementById("lote-count").textContent=LOTES.length+" lotes";\ndocument.getElementById("drawer-count").textContent=v.length;\nv.forEach(function(l,i){var lat=parseFloat(l.lat),lng=parseFloat(l.lng);if(isNaN(lat)||isNaN(lng))return;\nvar pop="<span style=\\"color:#C89B3C;font-weight:700;\\">#"+l.idHoja1+"</span><br><b>"+(l.codigolote||"Lote")+"</b><br>$"+(l.valor||"-")+"<br>"+(l.metros||"-")+" m²";\nif(l.fotolote)pop+="<br><img src=\\"https://drive.google.com/thumbnail?id="+l.fotolote+"\\" style=\\"width:100%;max-width:200px;\\">";\nvar c=L.circleMarker([lat,lng],{radius:8,color:"#1B2A4A",fillColor:"#3E7A4C",fillOpacity:.9}).addTo(lotesLayer).bindPopup(pop);\nmarcadores[i]=c;});\nvar lista=document.getElementById("lista");lista.innerHTML="";\nv.forEach(function(l,i){var d=document.createElement("div");d.className="lote-item";\nd.innerHTML="<div><b><span style=\\"color:#C89B3C;\\">#"+l.idHoja1+"</span> "+(l.codigolote||"Lote")+"</b><br><small>"+(l.metros||"-")+" m² · $"+(l.valor||"-")+"</small></div><span class=\\"badge\\">"+l.estado+"</span>";\nd.addEventListener("click",function(){map.setView([parseFloat(l.lat),parseFloat(l.lng)],16);if(marcadores[i])marcadores[i].openPopup();document.getElementById("drawer").classList.remove("open");});\nlista.appendChild(d);});}\ndocument.getElementById("buscador").addEventListener("input",render);\ndocument.getElementById("drawer-handle").addEventListener("click",function(){document.getElementById("drawer").classList.toggle("open");});\nrender();\n<\/script>\n</body>\n</html>';
