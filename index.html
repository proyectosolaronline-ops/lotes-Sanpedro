<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2A4A;--ink-soft:#334268;--paper:#F5F3EE;--paper-line:#E4E0D6;--ochre:#C89B3C;--ok:#3E7A4C;--danger:#B3403C;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);padding:16px;}
h1{font-family:'Fraunces',serif;font-size:1.3rem;margin:0 0 16px;}
.card{background:#fff;border:1px solid var(--paper-line);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:center;cursor:pointer;}
.card img{width:48px;height:48px;border-radius:6px;object-fit:cover;background:var(--paper-line);flex-shrink:0;}
.card .info{flex:1;min-width:0;}
.card b{font-family:'Fraunces',serif;font-size:.9rem;display:block;}
.card small{color:var(--ink-soft);font-size:.7rem;display:block;}
.badge{font-family:'JetBrains Mono',monospace;font-size:.6rem;padding:3px 8px;border-radius:10px;color:#fff;text-transform:uppercase;}
.badge.activo{background:var(--ok);}
.badge.inactivo{background:var(--danger);}
#vacio{text-align:center;color:var(--ink-soft);font-size:.85rem;padding:30px 0;display:none;}
</style>
</head>
<body>

<h1>Usuarios</h1>
<div id="lista"></div>
<p id="vacio">No hay usuarios registrados.</p>

<script>
  function cargarUsuarios(){
    google.script.run
      .withSuccessHandler(usuarios => {
        const lista = document.getElementById('lista');
        const vacio = document.getElementById('vacio');
        lista.innerHTML = '';
        if (!usuarios || usuarios.length === 0) {
          vacio.style.display = 'block';
          return;
        }
        vacio.style.display = 'none';
        usuarios.forEach(u => {
          const card = document.createElement('div');
          card.className = 'card';
          const activo = (u.estado || '').toLowerCase() === 'activo';
          card.innerHTML =
            '<div class="info"><b>' + (u.nombre || '(sin nombre)') + '</b>' +
            '<small>' + (u.correo || '') + '</small></div>' +
            '<span class="badge ' + (activo ? 'activo' : 'inactivo') + '">' + (u.estado || '-') + '</span>';
          card.addEventListener('click', () => {
            alert('Seleccionaste: ' + (u.nombre || u.correo));
          });
          lista.appendChild(card);
        });
      })
      .withFailureHandler(err => alert('Error: ' + err.message))
      .obtenerUsuariosAdmin();
  }

  cargarUsuarios();
</script>

</body>
</html>
