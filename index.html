{
  "@context": "https://schema.org",
  "@type": "RealEstateAgent",
  "name": "Fraccionamiento San pedro",

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2A4A;--ink-soft:#334268;--paper:#F5F3EE;--paper-line:#E4E0D6;--ochre:#C89B3C;--ok:#3E7A4C;--wa:#25D366;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);-webkit-tap-highlight-color:transparent;overflow:hidden;}
#map{position:fixed;inset:0;z-index:1;}
#map-status{
  position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:600;
  background:rgba(27,42,74,.9);color:var(--paper);font-family:'JetBrains Mono',monospace;
  font-size:.65rem;padding:5px 12px;border-radius:12px;letter-spacing:.4px;
  pointer-events:none;transition:opacity .3s;white-space:nowrap;
}
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:500;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:3px 10px;background:rgba(245,243,238,.94);backdrop-filter:blur(4px);
  border-bottom:2px solid var(--ink);
  text-align:center;
}
#topbar h1{font-family:'Fraunces',serif;font-size:.85rem;font-weight:700;margin:0;line-height:1.2;color:var(--ink);}
#topbar #topbar-desc{font-family:'Inter',sans-serif;font-size:.62rem;font-weight:400;color:var(--ink-soft);margin:0;line-height:1.2;}
#topbar .stamp{
  font-family:'JetBrains Mono',monospace;font-size:.5rem;color:var(--ink-soft);
  border:1px solid var(--ink-soft);padding:1px 6px;border-radius:2px;
  text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;margin-top:2px;
}
#btn-oficina{
  position:absolute;top:6px;right:8px;width:74px;height:32px;border-radius:6px;
  border:1px solid var(--paper-line);cursor:pointer;overflow:hidden;
  background-color:var(--ink);background-size:cover;background-position:center;
  padding:0;
}
#btn-oficina::after{
  content:"";position:absolute;inset:0;background:rgba(27,42,74,.5);
}
#btn-oficina-label{
  position:relative;z-index:1;color:#fff;font-family:'Fraunces',serif;
  font-size:.6rem;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4);
}
.fabs{ position:fixed; right:14px; z-index:900; display:flex; flex-direction:column; gap:10px; bottom:14px; }
.fab{
  width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.18);font-size:1.25rem;text-decoration:none;color:var(--ink);
}
.fab:active{ transform:scale(.94); }
.fab.on{ background:var(--ink); color:#fff; }
.fab.whats{ background:var(--wa); border-color:var(--wa); color:#fff; }
.fab.whats:active{ background:#1DA851; }
#drawer{
  position:fixed;left:0;right:0;bottom:0;z-index:800;
  background:#fff;border-top:2px solid var(--ink);border-radius:14px 14px 0 0;
  box-shadow:0 -4px 20px rgba(0,0,0,.15);
  max-height:70vh;transform:translateY(calc(100% - 58px));transition:transform .25s ease;
}
#drawer.open{ transform:translateY(0); }
#drawer-handle{
  padding:14px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;
}
#drawer-handle b{ font-family:'Fraunces',serif; font-size:.95rem; }
#drawer-handle span{ font-family:'JetBrains Mono',monospace; font-size:.7rem; color:var(--ink-soft); }
#drawer-body{ padding:0 18px 18px; overflow-y:auto; max-height:calc(70vh - 58px); }
input[type=text]{
  width:100%;padding:10px 12px;border:1px solid var(--paper-line);border-radius:3px;
  font-family:'Inter',sans-serif;font-size:1rem;background:var(--paper);color:var(--ink);
}
#aviso-radio{
  display:none;font-family:'Inter',sans-serif;font-size:.72rem;color:var(--ink-soft);
  background:var(--paper);border:1px solid var(--paper-line);border-radius:4px;
  padding:8px 10px;margin-top:10px;
}
#aviso-radio.mostrar{ display:block; }
#lista{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
.lote-item{
  border:1px solid var(--paper-line);border-radius:3px;padding:10px 12px;cursor:pointer;
  font-size:.82rem;display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.lote-item:active{ background:var(--paper); }
.lote-item b{ font-family:'Fraunces',serif; font-weight:500; display:block; }
.lote-item .lote-id{ font-family:'JetBrains Mono',monospace; font-size:.6rem; color:var(--ochre); font-weight:700; margin-right:4px; }
.lote-item small{ color:var(--ink-soft); font-size:.72rem; }
.badge{
  font-family:'JetBrains Mono',monospace;font-size:.6rem;padding:3px 8px;border-radius:10px;
  color:#fff;background:var(--ok);white-space:nowrap;text-transform:uppercase;flex-shrink:0;
}
#empty-msg{ font-size:.8rem; color:var(--ink-soft); text-align:center; padding:16px 0; display:none; }
.leaflet-popup-content{ font-family:'Inter',sans-serif; font-size:.85rem; }
.leaflet-popup-content b{ font-family:'Fraunces',serif; }
.leaflet-popup-content .lote-id-popup{ font-family:'JetBrains Mono',monospace; font-size:.65rem; color:var(--ochre); font-weight:700; }
@media (min-width:768px){
  #drawer{ left:auto; width:360px; right:16px; bottom:16px; border-radius:10px; border:1px solid var(--paper-line); border-top:1px solid var(--paper-line); max-height:calc(100vh - 100px); }
  #drawer-body{ max-height:calc(100vh - 158px); }
  .fabs{ right:392px; }
}
#modal-overlay{
  position:fixed;inset:0;z-index:2000;background:rgba(27,42,74,.55);
  display:none;align-items:center;justify-content:center;padding:20px;
}
#modal-overlay.open{ display:flex; }
#modal-box{
  background:#fff;border-radius:12px;width:100%;max-width:340px;max-height:88vh;
  overflow-y:auto;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.25);
}
#modal-close{
  position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.9);border:1px solid var(--paper-line);cursor:pointer;
  font-size:1rem;color:var(--ink);z-index:2;display:flex;align-items:center;justify-content:center;
}
#modal-foto{
  width:100%;height:160px;object-fit:cover;display:block;background:var(--paper-line);
  border-radius:12px 12px 0 0;
}
#modal-foto[src=""],#modal-foto.oculto{ display:none; }
#modal-info{ padding:16px; text-align:center; }
#modal-nombre{ font-family:'Fraunces',serif; font-size:1.15rem; font-weight:700; margin:0 0 4px; }
#modal-agente{ font-family:'Inter',sans-serif; font-size:.78rem; color:var(--ink); margin:0 0 4px; font-weight:600; }
#modal-agente:empty{ display:none; }
#modal-ubicacion{ font-family:'JetBrains Mono',monospace; font-size:.7rem; color:var(--ink-soft); margin:0 0 8px; }
#modal-desc{ font-size:.85rem; color:var(--ink-soft); margin:0 0 14px; line-height:1.4; }
#modal-actions{ display:flex; gap:8px; }
.modal-btn{
  flex:1;padding:10px 8px;border-radius:6px;text-decoration:none;font-size:.8rem;
  color:#fff;text-align:center;font-family:'Inter',sans-serif;font-weight:500;
}
.modal-btn.llegar{ background:var(--ink); }
.modal-btn.whats{ background:var(--wa); }
</style>
</head>

  <div id="map-status">📍 Buscando tu ubicación...</div>
</div>

<div id="topbar">
  <h1 id="topbar-nombre">Fraccionamiento San pedro</h1>
  <p id="topbar-desc">Venta de lotes residenciales en Mexicali. Encuentra tu terreno ideal.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // CONFIGURACIÓN
  let NEGOCIO_LAT = 32.62476;
  let NEGOCIO_LNG = -115.45389;
  let NEGOCIO_NOMBRE = "Fraccionamiento San pedro";
  let NEGOCIO_AGENTE = "Juan";
  let NEGOCIO_UBICACION = "Mexicali, B.C.";
  let NEGOCIO_TELEFONO = "6861234567";
  let NEGOCIO_DESCRIPCION = "Venta de lotes residenciales en Mexicali. Encuentra tu terreno ideal.";
  let NEGOCIO_FOTOBANNER = "https://i.imgur.com/banner.jpg";
  let NEGOCIO_ID = "";
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyEsQ878-r8KeLeZ4dOvHPN0bCohS23G-KM2ckDy-MjWLsyr8tvN2jPNiaTQycG3Ws/exec";

  // Radio base y escalones de ampliación automática (siempre medidos desde el GPS del celular)
  const RADIO_KM = 50;
  const ESCALONES_RADIO = [RADIO_KM, 100, 200, 500];

  let LOTES_DATA = [];
  let negocioMarker = null;
  let miUbicacionGPS = null;
  let radioActual = RADIO_KM; // radio efectivo usado en el último render (null = sin límite)
  let circuloRadio = null; // capa Leaflet del círculo de 50km dibujado en el mapa
  let seEncuadroSinGPS = false; // evita reencuadrar en cada render cuando no hay GPS

  const LOTES_EJEMPLO = [
    {"IdHoja1":1,"codigolote":"test","tipopago":"Financiamiento","estado":"Disponible","valor":55000,"metros":120,"medida":"10X14","lat":30.61868,"lng":-115.959885},
    {"IdHoja1":2,"codigolote":"test 2","tipopago":"Contado","estado":"Disponible","valor":55000,"metros":120,"medida":"10X12","lat":32.6379,"lng":-115.466502},
    {"IdHoja1":4,"codigolote":"lote 5","tipopago":"Contado","estado":"Disponible","valor":55000,"metros":130,"medida":"","lat":30.512908,"lng":-115.92755},
    {"IdHoja1":"","codigolote":"loto 10","tipopago":"Contado","estado":"Disponible","valor":60000,"metros":180,"medida":"7m x 10m","lat":30.489971,"lng":-115.921137}
  ];

  function construirLinkWhats(){
    let n = (NEGOCIO_TELEFONO || '').replace(/\D/g, '');
    if(n.length === 10) n = '52' + n;
    return 'https://wa.me/' + n + '?text=' + encodeURIComponent('Hola, vi sus lotes en venta y me interesa más información.');
  }

  function calcularDistancia(lat1, lon1, lat2, lon2){
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // Ajusta el mapa para que la vista inicial cubra siempre el radio base (50km) desde el GPS del celular
  function encuadrarRadioGPS(lat, lng, radioKm){
    radioKm = radioKm || RADIO_KM;
    const circuloRef = L.circle([lat, lng], { radius: radioKm * 1000 });
    map.fitBounds(circuloRef.getBounds());
  }

  // Dibuja (o mueve) el círculo de 50km centrado en el GPS del celular
  function dibujarCirculoRadio(lat, lng){
    if(circuloRadio){
      circuloRadio.setLatLng([lat, lng]);
    } else {
      circuloRadio = L.circle([lat, lng], {
        radius: RADIO_KM * 1000,
        color: '#1B2A4A',
        weight: 1.5,
        fillColor: '#C89B3C',
        fillOpacity: 0.08,
        dashArray: '4 6'
      }).addTo(map);
    }
  }

  // Filtra una lista de lotes contra el GPS del celular (nunca contra la oficina)
  function filtrarPorRadioGPS(lista, radioKm){
    return lista.filter(l => {
      const lat = parseFloat(l.lat), lng = parseFloat(l.lng);
      if(isNaN(lat) || isNaN(lng)) return false;
      return calcularDistancia(miUbicacionGPS.lat, miUbicacionGPS.lng, lat, lng) <= radioKm;
    });
  }

  function pintarNegocio(){
    document.getElementById('topbar-nombre').textContent = NEGOCIO_NOMBRE;
    document.getElementById('topbar-desc').textContent = NEGOCIO_DESCRIPCION;
    document.title = NEGOCIO_NOMBRE;

    // La oficina NO se dibuja como marcador en el mapa ni afecta la vista.
    // Solo se usa como referencia dentro del modal "Oficina" y el botón "Cómo llegar".
    if(negocioMarker){ map.removeLayer(negocioMarker); negocioMarker = null; }

    const btnWhats = document.getElementById('btn-whats');
    if(btnWhats) btnWhats.href = construirLinkWhats();

    const btnOficina = document.getElementById('btn-oficina');
    if(btnOficina && NEGOCIO_FOTOBANNER){
      btnOficina.style.backgroundImage = "url('" + NEGOCIO_FOTOBANNER + "')";
    }
  }

  function abrirModalOficina(){
    const foto = document.getElementById('modal-foto');
    if(NEGOCIO_FOTOBANNER){
      foto.src = NEGOCIO_FOTOBANNER;
      foto.classList.remove('oculto');
    } else {
      foto.classList.add('oculto');
    }
    document.getElementById('modal-nombre').textContent = NEGOCIO_NOMBRE;
    document.getElementById('modal-agente').textContent = NEGOCIO_AGENTE ? 'Atiende: ' + NEGOCIO_AGENTE : '';
    document.getElementById('modal-ubicacion').textContent =
      (NEGOCIO_ID ? 'ID: ' + NEGOCIO_ID + ' · ' : '') + NEGOCIO_UBICACION + (NEGOCIO_TELEFONO ? ' · ☎ ' + NEGOCIO_TELEFONO : '');
    document.getElementById('modal-desc').textContent = NEGOCIO_DESCRIPCION;
    document.getElementById('modal-btn-llegar').href =
      'https://www.google.com/maps/dir/?api=1&destination=' + NEGOCIO_LAT + ',' + NEGOCIO_LNG;
    document.getElementById('modal-btn-whats').href = construirLinkWhats();
    document.getElementById('modal-overlay').classList.add('open');

    if(GAS_URL){
      fetch(GAS_URL + "?accion=aviso&tipo=llegar").catch(()=>{});
    }
  }

  function cerrarModalOficina(){
    document.getElementById('modal-overlay').classList.remove('open');
  }

  // CARGAR DATOS DESDE GAS
  async function cargarDatosGAS(){
    try {
      const respNegocio = await fetch(GAS_URL + "?accion=negocio");
      const d = await respNegocio.json();
      if(d){
        if(d.nombrenegocio) NEGOCIO_NOMBRE = d.nombrenegocio;
        if(d.nombre) NEGOCIO_AGENTE = d.nombre;
        if(d.ubicacion) NEGOCIO_UBICACION = d.ubicacion;
        if(d.telefono) NEGOCIO_TELEFONO = String(d.telefono);
        if(d.lat) NEGOCIO_LAT = parseFloat(d.lat);
        if(d.lng) NEGOCIO_LNG = parseFloat(d.lng);
        if(d.descripcion) NEGOCIO_DESCRIPCION = d.descripcion;
        if(d.fotobanner) NEGOCIO_FOTOBANNER = d.fotobanner;
        if(d.idUsuario) NEGOCIO_ID = String(d.idUsuario);
      }
      pintarNegocio();
    } catch(e) {
      console.log('Negocio: usando datos default');
    }

    try {
      const respLotes = await fetch(GAS_URL + "?accion=lotes");
      const data = await respLotes.json();
      if(Array.isArray(data)){
        LOTES_DATA = data.filter(l => l.lat && l.lng && (l.estado||'').trim().toLowerCase() === 'disponible');
      }
    } catch(e) {
      console.log('Lotes: usando datos ejemplo');
      LOTES_DATA = LOTES_EJEMPLO;
    }
    render();
  }

  // MAPA — vista inicial neutral (NO la oficina); se reencuadra al GPS del celular en cuanto esté disponible
  const map = L.map('map', { tap:true, zoomControl:false }).setView([23.6345, -102.5528], 5);
  L.control.zoom({ position:'bottomleft' }).addTo(map);
  L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'], attribution: '© Google'
  }).addTo(map);

  pintarNegocio();

  // GEOLOCALIZACIÓN — única fuente de verdad: el GPS real del celular (watchPosition)
  const mapStatusVisor = document.getElementById('map-status');
  function ocultarStatusVisor(){ if(mapStatusVisor){ mapStatusVisor.style.opacity='0'; setTimeout(()=>mapStatusVisor.remove(),300); } }

  let primeraFijacionGPS = false; // true en cuanto llega la primera posición real del celular
  let datosGASCargados = false;

  function cargarDatosUnaVez(){
    if(datosGASCargados) return;
    datosGASCargados = true;
    cargarDatosGAS();
  }

  // Se ejecuta solo la primera vez que el GPS entrega una posición real
  function manejarPrimeraFijacion(lat, lng){
    if(primeraFijacionGPS) return;
    primeraFijacionGPS = true;
    dibujarCirculoRadio(lat, lng);
    encuadrarRadioGPS(lat, lng, RADIO_KM);
    ocultarStatusVisor();
    cargarDatosUnaVez();
  }


  // GPS EN TIEMPO REAL
  let watchId = null;
  let miMarcador = null;
  const btnGps = document.getElementById('btn-gps');

  function activarGPS(){
    if(!navigator.geolocation){
      if(mapStatusVisor){ mapStatusVisor.textContent = '📍 Este navegador no soporta GPS'; }
      setTimeout(ocultarStatusVisor, 2000);
      cargarDatosUnaVez();
      return;
    }
    btnGps.classList.add('on');
    watchId = navigator.geolocation.watchPosition(
      p => {
        miUbicacionGPS = {lat: p.coords.latitude, lng: p.coords.longitude};
        const ll = [p.coords.latitude, p.coords.longitude];
        dibujarCirculoRadio(ll[0], ll[1]);
        if(!miMarcador){
          miMarcador = L.circleMarker(ll, { radius:9, color:'#1B2A4A', weight:2, fillColor:'#C89B3C', fillOpacity:1 })
            .addTo(map).bindPopup('📍 Tú estás aquí');
        } else {
          miMarcador.setLatLng(ll);
        }
        manejarPrimeraFijacion(ll[0], ll[1]);
        render();
      },
      err => {
        console.warn('GPS error:', err);
        if(!primeraFijacionGPS){
          if(mapStatusVisor){ mapStatusVisor.textContent = '📍 No se pudo obtener tu ubicación'; }
          setTimeout(ocultarStatusVisor, 2000);
          cargarDatosUnaVez();
        }
      },
      { enableHighAccuracy:true, maximumAge:2000, timeout:10000 }
    );

    // Salvaguarda mobile: si en 12s el navegador no entrega ninguna posición
    // (permiso ignorado, GPS lento, etc.), continuar mostrando los lotes igual.
    setTimeout(() => {
      if(!primeraFijacionGPS){
        ocultarStatusVisor();
        cargarDatosUnaVez();
      }
    }, 12000);
  }

  function desactivarGPS(){
    if(watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    btnGps.classList.remove('on');
    if(miMarcador){ map.removeLayer(miMarcador); miMarcador = null; }
  }

  btnGps.addEventListener('click', () => {
    if(watchId === null) activarGPS(); else desactivarGPS();
  });

  activarGPS();

  document.getElementById('btn-oficina').addEventListener('click', abrirModalOficina);
  document.getElementById('modal-close').addEventListener('click', cerrarModalOficina);
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if(e.target.id === 'modal-overlay') cerrarModalOficina();
  });

  document.getElementById('btn-qr').addEventListener('click', () => {
    const w = window.open('', '_blank', 'width=280,height=340');
    w.document.write('<body style="font-family:sans-serif;text-align:center;padding:20px;"><div id="qr"></div><p>Escanea para ver los lotes</p></body>');
    const s = w.document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload = () => { new w.QRCode(w.document.getElementById('qr'), { text: window.location.href, width:200, height:200 }); };
    w.document.body.appendChild(s);
  });

  const drawer = document.getElementById('drawer');
  document.getElementById('drawer-handle').addEventListener('click', () => drawer.classList.toggle('open'));

  let lotesLayer = L.layerGroup().addTo(map);
  let marcadoresPorIndice = {};

  function render(){
    const texto = document.getElementById('buscador').value.trim().toLowerCase();
    lotesLayer.clearLayers();
    marcadoresPorIndice = {};

    // Filtrar por texto primero (aplica siempre, sin importar el radio)
    let base = [...LOTES_DATA];
    if(texto){
      base = base.filter(l =>
        (l.codigolote || l.nombre || '').toLowerCase().includes(texto) ||
        String(l.IdHoja1 || l.idHoja1 || '').includes(texto)
      );
    }

    let visibles = base;
    radioActual = RADIO_KM;

    if(miUbicacionGPS){
      // Ir ampliando el radio (medido siempre desde el GPS del celular) hasta encontrar lotes
      let encontrados = [];
      for(const radio of ESCALONES_RADIO){
        encontrados = filtrarPorRadioGPS(base, radio);
        radioActual = radio;
        if(encontrados.length > 0) break;
      }

      // Si ni con el radio más amplio (500km) hay lotes, mostrar todos sin límite de distancia
      if(encontrados.length === 0){
        encontrados = base.filter(l => !isNaN(parseFloat(l.lat)) && !isNaN(parseFloat(l.lng)));
        radioActual = null; // sin límite
      }

      visibles = encontrados;

      // Ordenar siempre por distancia al GPS del celular (más cerca primero)
      visibles.sort((a, b) => {
        const dA = calcularDistancia(miUbicacionGPS.lat, miUbicacionGPS.lng, parseFloat(a.lat), parseFloat(a.lng));
        const dB = calcularDistancia(miUbicacionGPS.lat, miUbicacionGPS.lng, parseFloat(b.lat), parseFloat(b.lng));
        return dA - dB;
      });
    } else if(base.length && !seEncuadroSinGPS){
      // Sin GPS (permiso denegado o no soportado): encuadrar todos los lotes disponibles, NUNCA la oficina
      const puntos = base
        .filter(l => !isNaN(parseFloat(l.lat)) && !isNaN(parseFloat(l.lng)))
        .map(l => [parseFloat(l.lat), parseFloat(l.lng)]);
      if(puntos.length){ map.fitBounds(puntos, { maxZoom: 13 }); seEncuadroSinGPS = true; }
    }

    // Etiqueta dinámica según el radio efectivo usado
    const etiquetaRadio = radioActual ? radioActual + 'km' : 'todos';
    document.getElementById('lote-count').textContent = visibles.length + ' en ' + etiquetaRadio;
    document.getElementById('drawer-count').textContent = visibles.length;

    // Aviso cuando se tuvo que ampliar el radio más allá del base
    const aviso = document.getElementById('aviso-radio');
    if(miUbicacionGPS && radioActual !== RADIO_KM && visibles.length > 0){
      aviso.textContent = radioActual
        ? 'No hay lotes en ' + RADIO_KM + 'km, mostrando resultados hasta ' + radioActual + 'km.'
        : 'No hay lotes cercanos, mostrando todos los disponibles.';
      aviso.classList.add('mostrar');
    } else {
      aviso.classList.remove('mostrar');
    }

    visibles.forEach((l, i) => {
      const lat = parseFloat(l.lat), lng = parseFloat(l.lng);
      if(isNaN(lat) || isNaN(lng)) return;

      let distTexto = '';
      if(miUbicacionGPS){
        const d = calcularDistancia(miUbicacionGPS.lat, miUbicacionGPS.lng, lat, lng);
        distTexto = '📍 ' + d.toFixed(1) + ' km · ';
      }

      let pop = '<span class="lote-id-popup">#' + (l.IdHoja1 || l.idHoja1 || '') + '</span><br><b>' + (l.codigolote || l.nombre || 'Sin nombre') + '</b><br>' + distTexto + 'Pago: ' + (l.tipopago||'-') +
        '<br>Valor: $' + Number(l.valor||0).toLocaleString() + '<br>' + (l.metros||'-') + ' m² · ' + (l.medida||'-');
      if(l.fotolote) pop += '<br><img src="https://drive.google.com/thumbnail?id=' + l.fotolote + '" style="width:100%;max-width:200px;border-radius:4px;margin-top:6px;">';
      pop += '<br><a href="https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng + '" target="_blank" style="display:inline-block;margin-top:6px;padding:6px 10px;background:#1B2A4A;color:#F5F3EE;border-radius:3px;text-decoration:none;font-size:.75rem;">🗺️ Cómo llegar</a>';
      const circle = L.circleMarker([lat,lng], { radius:9, color:'#1B2A4A', weight:1.5, fillColor:'#3E7A4C', fillOpacity:.9 }).addTo(lotesLayer).bindPopup(pop);
      marcadoresPorIndice[i] = circle;
    });

    const lista = document.getElementById('lista');
    const emptyMsg = document.getElementById('empty-msg');
    lista.innerHTML = '';
    emptyMsg.style.display = visibles.length ? 'none' : 'block';
    if(!visibles.length){
      emptyMsg.textContent = 'No hay lotes disponibles';
    }

    visibles.forEach((l, i) => {
      let distTexto = '';
      if(miUbicacionGPS){
        const d = calcularDistancia(miUbicacionGPS.lat, miUbicacionGPS.lng, parseFloat(l.lat), parseFloat(l.lng));
        distTexto = '📍 ' + d.toFixed(1) + ' km · ';
      }

      const item = document.createElement('div');
      item.className = 'lote-item';
      item.innerHTML = '<div><span class="lote-id">#' + (l.IdHoja1 || l.idHoja1 || '') + '</span><b>' + (l.codigolote || l.nombre || 'Sin nombre') + '</b><small>' +
        distTexto + (l.metros||'-') + ' m² · ' + (l.tipopago||'-') + '</small></div><span class="badge">$' + Number(l.valor||0).toLocaleString() + '</span>';
      item.addEventListener('click', () => {
        const lat = parseFloat(l.lat), lng = parseFloat(l.lng);
        if(isNaN(lat) || isNaN(lng)) return;
        map.setView([lat, lng], 16);
        if(marcadoresPorIndice[i]) marcadoresPorIndice[i].openPopup();
        drawer.classList.remove('open');
      });
      lista.appendChild(item);
    });
  }

  document.getElementById('buscador').addEventListener('input', render);
</script>
</body>
</html>
