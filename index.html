<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listado de Usuarios</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2A4A;--ink-soft:#334268;--paper:#F5F3EE;--paper-line:#E4E0D6;--ochre:#C89B3C;--ok:#3E7A4C;--danger:#B3403C;--highlight:#FFF8E7;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);padding:0;padding-bottom:80px;}

/* Encabezado */
.header{
  background:#fff;padding:20px 16px 16px;border-bottom:1px solid var(--paper-line);
  position:sticky;top:0;z-index:30;
}
.header h1{
  font-family:'Fraunces',serif;font-size:1.5rem;margin:0 0 4px;color:var(--ink);
}
.header .sub{
  font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--ink-soft);
  display:flex;gap:16px;margin-top:4px;
}
.search-bar{
  margin-top:12px;display:flex;gap:8px;
}
.search-bar input{
  flex:1;padding:10px 14px;border:1.5px solid var(--paper-line);border-radius:10px;
  font-family:'Inter',sans-serif;font-size:.85rem;background:var(--paper);color:var(--ink);
  transition:border-color .2s;
}
.search-bar input:focus{outline:none;border-color:var(--ochre);background:#fff;}

/* Lista de usuarios */
.user-list{
  padding:12px 16px;
}
.user-card{
  background:#fff;border:1px solid var(--paper-line);border-radius:12px;
  padding:14px 16px;margin-bottom:10px;cursor:pointer;
  transition:all .2s;display:flex;gap:14px;align-items:center;
}
.user-card:hover{
  background:var(--highlight);border-color:var(--ochre);
  box-shadow:0 2px 8px rgba(0,0,0,.08);transform:translateY(-1px);
}
.user-card:active{transform:scale(.99);}
.user-avatar{
  width:56px;height:56px;border-radius:12px;object-fit:cover;
  background:var(--paper-line);flex-shrink:0;
}
.user-info{flex:1;min-width:0;}
.user-info .name{
  font-family:'Fraunces',serif;font-size:1rem;font-weight:700;color:var(--ink);
  margin-bottom:2px;display:flex;align-items:center;gap:8px;
}
.user-info .email{
  font-size:.78rem;color:var(--ink-soft);margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.user-info .business{
  font-size:.72rem;color:var(--ochre);font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.user-meta{
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;
}
.badge{
  font-family:'JetBrains Mono',monospace;font-size:.6rem;padding:4px 10px;border-radius:12px;
  color:#fff;text-transform:uppercase;font-weight:700;
}
.badge.active{ background:var(--ok); }
.badge.inactive{ background:var(--danger); }
.edit-icon{
  font-size:1.1rem;opacity:.4;transition:opacity .2s;
}
.user-card:hover .edit-icon{opacity:1;}

/* Panel de edición */
#overlay{
  position:fixed;inset:0;background:rgba(27,42,74,.6);z-index:100;
  display:none;align-items:flex-end;justify-content:center;
}
#overlay.open{ display:flex; }
#panel{
  background:#fff;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:20px 18px;animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}

#panel h2{ font-family:'Fraunces',serif;font-size:1.2rem;margin:0 0 16px; }
label{ font-size:.7rem;color:var(--ink-soft);display:block;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px; }
input[type=text],input[type=email],input[type=tel],select,textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--paper-line);border-radius:8px;
  font-family:'Inter',sans-serif;font-size:.85rem;background:var(--paper);color:var(--ink);
  transition:border-color .2s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ochre);background:#fff;}
textarea{ resize:vertical;min-height:60px; }
.row2{ display:flex;gap:10px; }
.row2 > div{ flex:1; }

#foto-preview{
  width:100%;height:140px;border-radius:10px;object-fit:cover;background:var(--paper-line);
  margin-top:8px;display:none;
}
#foto-preview.show{ display:block; }
.foto-botones{ display:flex;gap:8px;margin-top:8px; }
.foto-botones label{
  flex:1;text-align:center;background:var(--ink);color:#fff;padding:10px;border-radius:8px;
  font-size:.75rem;cursor:pointer;margin:0;text-transform:none;letter-spacing:0;
  transition:background .2s;
}
.foto-botones label:hover{background:var(--ink-soft);}
.foto-botones input[type=file]{ display:none; }
#foto-estado{ font-size:.68rem;color:var(--ink-soft);margin-top:4px; }

.panel-actions{ display:flex;gap:10px;margin-top:20px; }
.btn{
  flex:1;padding:12px;border-radius:8px;border:none;font-size:.85rem;font-weight:600;cursor:pointer;
  transition:all .2s;
}
.btn.primary{ background:var(--ink);color:#fff; }
.btn.primary:hover{background:var(--ink-soft);}
.btn.secondary{ background:var(--paper);color:var(--ink);border:1.5px solid var(--paper-line); }
.btn.secondary:hover{background:#fff;}
.btn.danger{ background:var(--danger);color:#fff; }
.btn.danger:hover{opacity:.9;}

#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:24px;font-size:.8rem;
  font-weight:500;opacity:0;pointer-events:none;transition:opacity .3s;z-index:200;
  box-shadow:0 4px 16px rgba(0,0,0,.2);
}
#toast.show{ opacity:1; }

.empty-state{
  text-align:center;padding:60px 20px;color:var(--ink-soft);
}
.empty-state .icon{font-size:3rem;margin-bottom:12px;}
.empty-state p{font-size:.9rem;margin:0;}

.stats{
  font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--ink-soft);
  padding:0 16px 8px;text-align:right;
}
</style>
</head>
<body>

<!-- ENCABEZADO -->
<div class="header">
  <h1>📋 Directorio de Usuarios</h1>
  <div class="sub">
    <span>Sesión: <?= correo ?></span>
    <? if (nombreUsuario) { ?><span>👤 <?= nombreUsuario ?></span><? } ?>
  </div>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="🔍 Buscar por nombre, correo o negocio..." autocomplete="off">
  </div>
</div>

<!-- ESTADÍSTICAS -->
<div class="stats" id="stats"></div>

<!-- LISTA DE USUARIOS -->
<div class="user-list" id="user-list"></div>
<div class="empty-state" id="empty-state" style="display:none;">
  <div class="icon">📭</div>
  <p>No se encontraron usuarios</p>
</div>

<!-- PANEL DE EDICIÓN -->
<div id="overlay">
  <div id="panel">
    <h2 id="panel-title">Editar Usuario</h2>
    
    <label>Nombre completo</label>
    <input type="text" id="f-nombre" placeholder="Juan Pérez García">

    <label>Correo electrónico</label>
    <input type="email" id="f-correo" placeholder="correo@gmail.com" disabled>

    <div class="row2">
      <div>
        <label>Estado</label>
        <select id="f-estado">
          <option value="Activo">✅ Activo</option>
          <option value="Inactivo">⛔ Inactivo</option>
        </select>
      </div>
      <div>
        <label>Teléfono</label>
        <input type="tel" id="f-telefono" placeholder="6861234567">
      </div>
    </div>

    <label>Nombre del negocio</label>
    <input type="text" id="f-nombrenegocio" placeholder="Lotes del Valle">

    <label>Ubicación</label>
    <input type="text" id="f-ubicacion" placeholder="Mexicali, B.C.">

    <div class="row2">
      <div>
        <label>Latitud</label>
        <input type="text" id="f-lat" placeholder="32.62476">
      </div>
      <div>
        <label>Longitud</label>
        <input type="text" id="f-lng" placeholder="-115.45389">
      </div>
    </div>
    <button type="button" class="btn secondary" style="width:100%;margin-top:8px;" id="btn-mi-ubicacion">
      📍 Usar mi ubicación actual
    </button>

    <label>Descripción</label>
    <textarea id="f-descripcion" placeholder="Descripción del negocio o servicios..."></textarea>

    <label>Palabras clave</label>
    <input type="text" id="f-palabrasclave" placeholder="lotes, terrenos, venta">

    <label>Foto de perfil</label>
    <img id="foto-preview">
    <input type="hidden" id="f-fotobanner">
    <div class="foto-botones">
      <label>📷 Cámara
        <input type="file" accept="image/*" capture="environment" id="input-camara">
      </label>
      <label>🖼️ Galería
        <input type="file" accept="image/*" id="input-galeria">
      </label>
    </div>
    <p id="foto-estado"></p>

    <div class="panel-actions">
      <button type="button" class="btn secondary" id="btn-cancelar">Cancelar</button>
      <button type="button" class="btn primary" id="btn-guardar">💾 Guardar cambios</button>
    </div>
    <button type="button" class="btn danger" style="width:100%;margin-top:12px;" id="btn-eliminar">
      🗑️ Eliminar usuario
    </button>
  </div>
</div>

<div id="toast"></div>

<script>
  const CORREO_SESION = <?= JSON.stringify(correo) ?>;
  let USUARIOS = [];
  let editandoCorreoOriginal = null;

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function cargarUsuarios(){
    google.script.run
      .withSuccessHandler(usuarios => {
        USUARIOS = usuarios || [];
        pintarLista(USUARIOS);
      })
      .withFailureHandler(err => toast('❌ Error al cargar: ' + err.message))
      .obtenerUsuariosAdmin(CORREO_SESION);
  }

  function urlFoto(idOUrl){
    if (!idOUrl) return '';
    if (idOUrl.indexOf('http') === 0) return idOUrl;
    return 'https://drive.google.com/thumbnail?id=' + idOUrl;
  }

  function pintarLista(usuarios){
    const lista = document.getElementById('user-list');
    const empty = document.getElementById('empty-state');
    const stats = document.getElementById('stats');
    
    lista.innerHTML = '';
    
    if (usuarios.length === 0) {
      empty.style.display = 'block';
      stats.textContent = '';
    } else {
      empty.style.display = 'none';
      const activos = usuarios.filter(u => (u.estado || '').toLowerCase() === 'activo').length;
      stats.textContent = `Total: ${usuarios.length} · Activos: ${activos}`;
    }

    usuarios.forEach(u => {
      const card = document.createElement('div');
      card.className = 'user-card';
      const activo = (u.estado || '').toLowerCase() === 'activo';
      
      card.innerHTML =
        '<img src="' + urlFoto(u.fotobanner) + '" class="user-avatar" onerror="this.style.display=\'none\'" loading="lazy">' +
        '<div class="user-info">' +
          '<div class="name">' +
            (u.nombre || '(Sin nombre)') +
            '<span class="edit-icon">✏️</span>' +
          '</div>' +
          '<div class="email">' + (u.correo || 'Sin correo') + '</div>' +
          '<div class="business">' + (u.nombrenegocio || 'Sin negocio') + '</div>' +
        '</div>' +
        '<div class="user-meta">' +
          '<span class="badge ' + (activo ? 'active' : 'inactive') + '">' + (u.estado || '-') + '</span>' +
          (u.telefono ? '<small style="font-size:.65rem;color:var(--ink-soft);">📱 ' + u.telefono + '</small>' : '') +
        '</div>';
      
      card.addEventListener('click', () => abrirPanel(u));
      lista.appendChild(card);
    });
  }

  // Búsqueda en tiempo real
  document.getElementById('search-input').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase().trim();
    if (!query) {
      pintarLista(USUARIOS);
      return;
    }
    const filtrados = USUARIOS.filter(u => 
      (u.nombre || '').toLowerCase().includes(query) ||
      (u.correo || '').toLowerCase().includes(query) ||
      (u.nombrenegocio || '').toLowerCase().includes(query) ||
      (u.telefono || '').includes(query)
    );
    pintarLista(filtrados);
  });

  function abrirPanel(usuario){
    document.getElementById('panel-title').textContent = '✏️ Editar: ' + (usuario.nombre || 'Usuario');
    editandoCorreoOriginal = usuario.correo;

    document.getElementById('f-nombre').value = usuario.nombre || '';
    document.getElementById('f-correo').value = usuario.correo || '';
    document.getElementById('f-estado').value = usuario.estado || 'Activo';
    document.getElementById('f-telefono').value = usuario.telefono || '';
    document.getElementById('f-nombrenegocio').value = usuario.nombrenegocio || '';
    document.getElementById('f-ubicacion').value = usuario.ubicacion || '';
    document.getElementById('f-lat').value = usuario.lat || '';
    document.getElementById('f-lng').value = usuario.lng || '';
    document.getElementById('f-descripcion').value = usuario.descripcion || '';
    document.getElementById('f-palabrasclave').value = usuario.palabrasclave || '';
    document.getElementById('f-fotobanner').value = usuario.fotobanner || '';

    const preview = document.getElementById('foto-preview');
    if (usuario.fotobanner) {
      preview.src = urlFoto(usuario.fotobanner);
      preview.classList.add('show');
    } else {
      preview.classList.remove('show');
      preview.src = '';
    }
    document.getElementById('foto-estado').textContent = '';
    document.getElementById('btn-eliminar').style.display = 'block';
    document.getElementById('overlay').classList.add('open');
  }

  function cerrarPanel(){
    document.getElementById('overlay').classList.remove('open');
    editandoCorreoOriginal = null;
  }

  document.getElementById('btn-cancelar').addEventListener('click', cerrarPanel);
  document.getElementById('overlay').addEventListener('click', e => {
    if (e.target.id === 'overlay') cerrarPanel();
  });

  // Manejo de fotos
  function manejarArchivo(file){
    if (!file) return;
    const preview = document.getElementById('foto-preview');
    const estado = document.getElementById('foto-estado');

    const lector = new FileReader();
    lector.onload = () => {
      preview.src = lector.result;
      preview.classList.add('show');
    };
    lector.readAsDataURL(file);

    estado.textContent = '⏳ Subiendo foto...';
    const lectorBase64 = new FileReader();
    lectorBase64.onload = () => {
      const base64 = lectorBase64.result.split(',')[1];
      google.script.run
        .withSuccessHandler(id => {
          if (id) {
            document.getElementById('f-fotobanner').value = id;
            estado.textContent = '✅ Foto actualizada';
          } else {
            estado.textContent = '❌ Error al subir foto';
          }
        })
        .withFailureHandler(err => { estado.textContent = '❌ ' + err.message; })
        .subirFotoBase64(base64, 'banner_' + Date.now());
    };
    lectorBase64.readAsDataURL(file);
  }

  document.getElementById('input-camara').addEventListener('change', e => manejarArchivo(e.target.files[0]));
  document.getElementById('input-galeria').addEventListener('change', e => manejarArchivo(e.target.files[0]));

  // Ubicación
  document.getElementById('btn-mi-ubicacion').addEventListener('click', () => {
    if (!navigator.geolocation) { toast('Geolocalización no soportada'); return; }
    navigator.geolocation.getCurrentPosition(
      p => {
        document.getElementById('f-lat').value = p.coords.latitude.toFixed(6);
        document.getElementById('f-lng').value = p.coords.longitude.toFixed(6);
        toast('📍 Ubicación actualizada');
      },
      () => toast('⚠️ No se pudo obtener ubicación')
    );
  });

  // Guardar
  document.getElementById('btn-guardar').addEventListener('click', () => {
    const payload = {
      nombre: document.getElementById('f-nombre').value.trim(),
      correo: editandoCorreoOriginal,
      estado: document.getElementById('f-estado').value,
      telefono: document.getElementById('f-telefono').value.trim(),
      nombrenegocio: document.getElementById('f-nombrenegocio').value.trim(),
      ubicacion: document.getElementById('f-ubicacion').value.trim(),
      lat: document.getElementById('f-lat').value.trim(),
      lng: document.getElementById('f-lng').value.trim(),
      descripcion: document.getElementById('f-descripcion').value.trim(),
      palabrasclave: document.getElementById('f-palabrasclave').value.trim(),
      fotobanner: document.getElementById('f-fotobanner').value.trim()
    };

    google.script.run
      .withSuccessHandler(() => {
        toast('✅ Usuario actualizado');
        cerrarPanel();
        cargarUsuarios();
      })
      .withFailureHandler(err => toast('❌ Error: ' + err.message))
      .guardarUsuario(CORREO_SESION, payload);
  });

  // Eliminar
  document.getElementById('btn-eliminar').addEventListener('click', () => {
    if (!editandoCorreoOriginal) return;
    if (!confirm('¿Eliminar permanentemente a ' + editandoCorreoOriginal + '?')) return;

    google.script.run
      .withSuccessHandler(() => {
        toast('🗑️ Usuario eliminado');
        cerrarPanel();
        cargarUsuarios();
      })
      .withFailureHandler(err => toast('❌ Error: ' + err.message))
      .eliminarUsuario(CORREO_SESION, editandoCorreoOriginal);
  });

  // Cargar al iniciar
  cargarUsuarios();
</script>

</body>
</html>
