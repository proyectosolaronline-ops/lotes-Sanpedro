<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lotes en Venta</title>
<meta name="description" content="Venta de lotes residenciales en Mexicali. Encuentra tu terreno ideal.">
<meta name="keywords" content="lotes, terrenos, venta, Mexicali, ca">
<meta name="robots" content="index, follow">
<meta name="geo.region" content="MX-BCN">
<meta property="og:title" content="Lotes en Venta">
<meta property="og:description" content="Venta de lotes residenciales en Mexicali. Encuentra tu terreno ideal.">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_MX">
<link rel="canonical" href="TU_URL_CANONICA">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="preconnect" href="https:
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A; --ink-soft:#334268; --paper:#F5F3EE; --paper-line:#E4E0D6;
    --ochre:#C89B3C; --ok:#3E7A4C; --sold:#8A2B2B; --held:#B8842B; --legal:#5B4B8A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter', sans-serif; background:var(--paper); color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  #banner{
    width:100%; 
  }
  #banner img{
    width:100%; height:auto; max-height:220px; object-fit:cover; display:block;
  }
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:12px 16px; border-bottom:2px solid var(--ink); background:var(--paper);
    flex-wrap:wrap; gap:6px; position:sticky; top:0; z-index:1000;
  }
  header h1{ font-family:'Fraunces', serif; font-size:1.05rem; font-weight:700; margin:0; }
  header .stamp{
    font-family:'JetBrains Mono', monospace; font-size:.62rem; color:var(--ink-soft);
    border:1px solid var(--ink-soft); padding:3px 8px; border-radius:2px;
    text-transform:uppercase; letter-spacing:1px; white-space:nowrap;
  }
  .layout{ display:flex; flex-direction:column; min-height:calc(100vh - 56px); }
  #map{ height:55vh; min-height:320px; width:100%; border-bottom:2px solid var(--ink); order:1; }
  .panel{ padding:16px; overflow-y:auto; flex:1; order:2; max-height:none; }
  .card{
    background:#fff; border:1px solid var(--paper-line); border-radius:4px;
    padding:14px 16px; margin-bottom:16px; position:relative;
  }
  .card::before{
    content:attr(data-tag); position:absolute; top:-10px; left:12px;
    background:var(--ink); color:var(--paper); font-family:'JetBrains Mono', monospace;
    font-size:.6rem; letter-spacing:1px; padding:2px 7px; border-radius:2px;
  }
  .legend{ display:flex; flex-wrap:wrap; gap:8px; }
  .legend .item{
    display:flex; align-items:center; gap:5px; font-size:.72rem; color:var(--ink-soft);
    cursor:pointer; user-select:none; padding:4px 0;
  }
  .legend .item.off{ opacity:.35; }
  .dot{ width:11px; height:11px; border-radius:50%; display:inline-block; border:1px solid rgba(0,0,0,.2); flex-shrink:0; }
  .dot.ok{background:var(--ok);} .dot.sold{background:var(--sold);}
  .dot.held{background:var(--held);} .dot.legal{background:var(--legal);}
  input[type=text]{
    width:100%; padding:10px 12px; border:1px solid var(--paper-line); border-radius:3px;
    font-family:'Inter', sans-serif; font-size:1rem; background:var(--paper); color:var(--ink);
    -webkit-appearance:none;
  }
  input:focus{ outline:2px solid var(--ochre); outline-offset:1px; background:#fff; }
  label{
    display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.6px;
    color:var(--ink-soft); margin:0 0 5px; font-weight:600;
  }
  .hint{ font-size:.7rem; color:var(--ink-soft); margin:6px 0 0; font-style:italic; }
  #lista{ display:flex; flex-direction:column; gap:6px; max-height:280px; overflow-y:auto; }
  .lote-item{
    border:1px solid var(--paper-line); border-radius:3px; padding:10px 12px;
    cursor:pointer; font-size:.78rem; display:flex; justify-content:space-between;
    align-items:center; gap:8px; -webkit-tap-highlight-color:transparent;
  }
  .lote-item:active{ background:var(--paper); }
  .lote-item b{ font-family:'Fraunces', serif; font-weight:500; display:block; }
  .lote-item small{ color:var(--ink-soft); font-size:.7rem; }
  .badge{
    font-family:'JetBrains Mono', monospace; font-size:.58rem; padding:3px 7px;
    border-radius:10px; color:#fff; white-space:nowrap; text-transform:uppercase; flex-shrink:0;
  }
  .leaflet-popup-content{ font-family:'Inter', sans-serif; font-size:.82rem; }
  .leaflet-popup-content b{ font-family:'Fraunces', serif; }
  #empty-msg{ font-size:.78rem; color:var(--ink-soft); text-align:center; padding:20px 0; display:none; }
  #btn-mi-ubicacion{
    position:fixed; bottom:80px; right:16px; z-index:1100;
    width:42px; height:42px; border-radius:50%; background:#fff;
    border:2px solid var(--ink); display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.15); font-size:1.2rem;
    -webkit-tap-highlight-color:transparent;
  }
  #btn-mi-ubicacion:active{ background:var(--paper); transform:scale(.95); }
  #fab-oficina, #fab-qr{
    position:fixed; right:16px; z-index:1200;
    display:flex; align-items:center; gap:6px;
    padding:12px 16px; background:var(--ink); color:var(--paper);
    border:none; border-radius:30px;
    font-family:'JetBrains Mono', monospace; font-size:.7rem;
    letter-spacing:.5px; text-transform:uppercase; text-decoration:none;
    box-shadow:0 4px 14px rgba(27,42,74,.35);
    -webkit-tap-highlight-color:transparent; cursor:pointer;
  }
  #fab-oficina{ bottom:16px; }
  #fab-qr{ bottom:70px; }
  #fab-oficina:active, #fab-qr:active{ background:var(--ochre); color:var(--ink); transform:scale(.96); }
  #fab-oficina svg, #fab-qr svg{ width:15px; height:15px; flex-shrink:0; }
  #qr-modal{
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,.6); z-index:2000; align-items:center; justify-content:center;
  }
  #qr-modal.show{ display:flex; }
  #qr-modal .box{
    background:#fff; border-radius:8px; padding:24px; text-align:center;
    max-width:300px; width:90%;
  }
  #qr-modal canvas{ max-width:220px; height:auto; }
  #qr-modal button{
    margin-top:12px; padding:10px 20px; background:var(--ink); color:var(--paper);
    border:none; border-radius:4px; cursor:pointer; font-size:.8rem;
  }
  .footer-info{
    text-align:center; padding:12px 16px; font-size:.7rem; color:var(--ink-soft);
    border-top:1px solid var(--paper-line); margin-top:8px;
  }
  @media (min-width:768px){
    #banner img{ max-height:280px; }
    header{ padding:14px 20px; }
    header h1{ font-size:1.25rem; }
    .layout{ display:grid; grid-template-columns:1fr 340px; min-height:calc(100vh - 60px); }
    #map{ height:100%; min-height:520px; border-right:2px solid var(--ink); border-bottom:none; }
    .panel{ padding:20px 22px; max-height:calc(100vh - 60px); }
    .card{ padding:16px 18px; margin-bottom:18px; }
    .legend .item{ font-size:.76rem; }
    input[type=text]{ font-size:.88rem; }
    #lista{ max-height:340px; }
    .lote-item{ font-size:.8rem; padding:9px 11px; }
    #btn-mi-ubicacion{ bottom:100px; right:22px; width:46px; height:46px; }
    #fab-qr{ bottom:90px; right:22px; }
    #fab-oficina{ bottom:22px; right:22px; }
    #fab-oficina, #fab-qr{ font-size:.78rem; padding:13px 18px; }
    #fab-oficina:hover, #fab-qr:hover{ background:var(--ochre); color:var(--ink); transform:translateY(-2px); }
  }
</style>
</head>
<body>

<div id="banner"><img src="https://i.imgur.com/banner.jpg" alt="Lotes en Venta"></div>

<header>
  <h1>Lotes en Venta</h1>
  <span class="stamp" id="lote-count">1 lotes</span>
</header>

<div class="layout">
  <div id="map"></div>
  <div class="panel">
    <div class="card" data-tag="Filtrar">
      <input type="text" id="buscador" placeholder="Buscar por nombre..." inputmode="text">
      <div class="legend" id="legend" style="margin-top:10px;">
        <span class="item" data-estado="Disponible"><i class="dot ok"></i>Disponible</span>
        <span class="item" data-estado="Apartado"><i class="dot held"></i>Apartado</span>
        <span class="item" data-estado="Vendido"><i class="dot sold"></i>Vendido</span>
        <span class="item" data-estado="En juridico"><i class="dot legal"></i>En jurídico</span>
      </div>
      <p class="hint">Toca un estado para ocultarlo o mostrarlo.</p>
    </div>
    <div class="card" data-tag="Lotes">
      <div id="lista"></div>
      <p id="empty-msg">No hay lotes que coincidan con el filtro.</p>
    </div>
    <div class="footer-info">Lotes en Venta · Mexicali, B.C. · ☎ 6861234567</div>
  </div>
</div>

<button id="btn-mi-ubicacion" title="Mi ubicación" aria-label="Ir a mi ubicación">📍</button>
<button id="fab-qr" title="Compartir QR" aria-label="Compartir QR">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="3" height="3"></rect><rect x="20" y="14" width="3" height="3"></rect><rect x="14" y="20" width="3" height="3"></rect><rect x="20" y="20" width="3" height="3"></rect></svg>
  QR
</button>
<a id="fab-oficina" href="https://www.google.com/maps/dir/?api=1&destination=32.62476,-115.45389" title="Cómo llegar a la oficina" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
  Oficina
</a>

<div id="qr-modal">
  <div class="box">
    <canvas id="qr-canvas"></canvas>
    <p style="font-size:.8rem;margin:8px 0;">Escanea para ver los lotes</p>
    <button onclick="document.getElementById('qr-modal').classList.remove('show')">Cerrar</button>
  </div>
</div>

<script src="https:
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const NEGOCIO_LAT = 32.62476;
  const NEGOCIO_LNG = -115.45389;
  const NEGOCIO_NOMBRE = "Lotes en Venta";
  const NEGOCIO_UBICACION = "Mexicali, B.C.";
  const NEGOCIO_TELEFONO = "6861234567";
  const CENTRO_LAT = 32.62476;
  const CENTRO_LNG = -115.45389;
   const GAS_URL = "https:
  let LOTES_DATA = [{"fecha":-115.960228,"estado":"Disponible","fotolote":"2026-07-25T02:14:44.348Z","medida":"","codigolote":"test lote 1","valor":55000,"lat | lng ":30.619418,"tipopago":"Contado","metros":""}];

  
  fetch(GAS_URL + '?accion=lotes')
    .then(r => r.json())
    .then(data => {
      if(Array.isArray(data) && data.length > 0){
        LOTES_DATA = data.filter(l => l.lat && l.lng);
        render();
      }
    });

  
  document.getElementById('fab-qr').addEventListener('click', () => {
    document.getElementById('qr-modal').classList.add('show');
    const canvas = document.getElementById('qr-canvas');
    canvas.innerHTML = '';
    new QRCode(canvas, { text: window.location.href, width:200, height:200 });
  });

  
  const map = L.map('map', { tap:true }).setView([CENTRO_LAT, CENTRO_LNG], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
  }).addTo(map);

  
  const markerOficina = L.marker([NEGOCIO_LAT, NEGOCIO_LNG]).addTo(map);
  markerOficina.bindPopup(
    '<b>'+NEGOCIO_NOMBRE+'</b><br>'+NEGOCIO_UBICACION+
    (NEGOCIO_TELEFONO?'<br>☎ '+NEGOCIO_TELEFONO:'')+
    '<br><a href="https://www.google.com/maps/dir/?api=1&destination='+NEGOCIO_LAT+','+NEGOCIO_LNG+'" target="_blank" style="display:inline-block;margin-top:6px;padding:6px 10px;background:#1B2A4A;color:#F5F3EE;border-radius:3px;text-decoration:none;font-size:.75rem;">🗺️ Cómo llegar a la oficina</a>'
  );

  let lotesLayer = L.layerGroup().addTo(map);
  let estadosOcultos = new Set();
  let marcadoresPorIndice = {};

  function colorEstado(e){
    switch((e||'').toLowerCase()){
      case 'disponible': return '#3E7A4C';
      case 'vendido': return '#8A2B2B';
      case 'apartado': return '#B8842B';
      case 'en juridico': return '#5B4B8A';
      default: return '#334268';
    }
  }

  function render(){
    const texto = document.getElementById('buscador').value.trim().toLowerCase();
    lotesLayer.clearLayers();
    marcadoresPorIndice = {};
    const visibles = LOTES_DATA.filter(l =>
      !estadosOcultos.has((l.estado||'').trim()) &&
      (!texto || (l.codigolote||l.nombre||'').toLowerCase().includes(texto))
    );
    document.getElementById('lote-count').textContent =
      visibles.length + ' lote' + (visibles.length===1?'':'s') +
      (visibles.length !== LOTES_DATA.length ? ' de ' + LOTES_DATA.length : '');

    visibles.forEach((l, i) => {
      const lat=parseFloat(l.lat), lng=parseFloat(l.lng);
      if(isNaN(lat)||isNaN(lng)) return;
      let popupHTML = '<b>'+ (l.codigolote||l.nombre||'Sin nombre') +'</b><br>'+
        'Estado: '+ (l.estado||'-') +'<br>Pago: '+ (l.tipopago||'-') +
        '<br>Valor: $'+ (l.valor||'-') +'<br>'+ (l.metros||'-') +' m² · '+ (l.medida||'-');
      if(l.fotolote){
        popupHTML += '<br><img src="https://drive.google.com/thumbnail?id='+ l.fotolote +'" style="width:100%;max-width:200px;border-radius:4px;margin-top:6px;">';
      }
      popupHTML += '<br><a href="https://www.google.com/maps/dir/?api=1&destination='+ lat +','+ lng +'" target="_blank" style="display:inline-block;margin-top:6px;padding:6px 10px;background:#1B2A4A;color:#F5F3EE;border-radius:3px;text-decoration:none;font-size:.75rem;">🗺️ Cómo llegar al lote</a>';
      const circle = L.circleMarker([lat,lng], {
        radius:9, color:'#1B2A4A', weight:1.5, fillColor:colorEstado(l.estado), fillOpacity:.9
      }).addTo(lotesLayer).bindPopup(popupHTML);
      marcadoresPorIndice[i] = circle;
    });

    const lista = document.getElementById('lista');
    const emptyMsg = document.getElementById('empty-msg');
    lista.innerHTML = '';
    emptyMsg.style.display = visibles.length ? 'none' : 'block';
    visibles.forEach((l, i) => {
      const item = document.createElement('div');
      item.className = 'lote-item';
      item.innerHTML =
        '<div><b>'+ (l.codigolote||l.nombre||'Sin nombre') +'</b><small>'+ (l.metros||'-') +' m² · '+ (l.tipopago||'-') +'</small></div>'+
        '<span class="badge" style="background:'+ colorEstado(l.estado) +'">'+ (l.estado||'-') +'</span>';
      item.addEventListener('click', () => {
        const lat=parseFloat(l.lat), lng=parseFloat(l.lng);
        if(isNaN(lat)||isNaN(lng)) return;
        map.setView([lat,lng], 16);
        if(marcadoresPorIndice[i]) marcadoresPorIndice[i].openPopup();
        if(window.innerWidth<=768) map.scrollIntoView({behavior:'smooth'});
      });
      lista.appendChild(item);
    });
  }

  document.getElementById('buscador').addEventListener('input', render);
  document.querySelectorAll('#legend .item').forEach(el => {
    el.addEventListener('click', () => {
      const e = el.getAttribute('data-estado');
      estadosOcultos.has(e) ? (estadosOcultos.delete(e), el.classList.remove('off'))
        : (estadosOcultos.add(e), el.classList.add('off'));
      render();
    });
  });

  document.getElementById('btn-mi-ubicacion').addEventListener('click', () => {
    if(!navigator.geolocation){ map.setView([CENTRO_LAT, CENTRO_LNG], 14); return; }
    navigator.geolocation.getCurrentPosition(
      pos => {
        map.setView([pos.coords.latitude, pos.coords.longitude], 15);
        L.circleMarker([pos.coords.latitude, pos.coords.longitude], {
          radius:8, color:'#1B2A4A', weight:2, fillColor:'#C89B3C', fillOpacity:1
        }).addTo(map).bindPopup('📍 Tú estás aquí');
      },
      () => map.setView([CENTRO_LAT, CENTRO_LNG], 14),
      { enableHighAccuracy:true, timeout:8000, maximumAge:60000 }
    );
  });

  render();
</script>
</body>
</html>
