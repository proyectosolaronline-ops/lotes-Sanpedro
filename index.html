<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-acento: #2196F3;
            --color-fondo: #f8f9fa;
            --color-texto: #212529;
            --color-gris: #6c757d;
            --color-borde: #dee2e6;
            --radio-borde: 12px;
            --sombra: 0 2px 8px rgba(0,0,0,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--color-fondo);
            color: var(--color-texto);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ========== HEADER ========== */
        .header {
            background: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--sombra);
            gap: 12px;
        }

        .logo-header {
            height: 36px;
            width: auto;
            border-radius: 6px;
        }

        .header-info {
            flex: 1;
            min-width: 0;
        }

        .header-nombre {
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-eslogan {
            font-size: 11px;
            color: var(--color-gris);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icono {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--color-fondo);
            color: var(--color-texto);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-icono:active {
            transform: scale(0.93);
            background: var(--color-borde);
        }

        /* ========== CONTENEDOR PRINCIPAL ========== */
        .main-container {
            padding: 12px;
            padding-bottom: 80px;
        }

        /* ========== SECCIÓN NEGOCIO ========== */
        .negocio-card {
            background: white;
            border-radius: var(--radio-borde);
            box-shadow: var(--sombra);
            overflow: hidden;
            margin-bottom: 16px;
        }

        .banner-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: var(--color-borde);
        }

        .negocio-body {
            padding: 16px;
        }

        .negocio-nombre {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .negocio-eslogan {
            color: var(--color-gris);
            font-size: 13px;
            margin-bottom: 12px;
        }

        .negocio-descripcion {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
            color: #495057;
        }

        .info-contacto {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .contacto-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            font-size: 14px;
            color: var(--color-texto);
            text-decoration: none;
            border-bottom: 1px solid var(--color-fondo);
        }

        .contacto-item i {
            width: 20px;
            text-align: center;
            color: var(--color-acento);
        }

        .redes-sociales {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn-red {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--color-acento);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.2s;
        }

        .btn-red:active {
            transform: scale(0.9);
        }

        /* ========== CATÁLOGO ========== */
        .catalogo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .catalogo-titulo {
            font-size: 18px;
            font-weight: 700;
        }

        .categorias-filtro {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .categorias-filtro::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid var(--color-borde);
            background: white;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .cat-chip.activo {
            background: var(--color-acento);
            color: white;
            border-color: var(--color-acento);
        }

        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .producto-card {
            background: white;
            border-radius: var(--radio-borde);
            box-shadow: var(--sombra);
            overflow: hidden;
            transition: all 0.2s;
            position: relative;
        }

        .producto-card:active {
            transform: scale(0.97);
        }

        .producto-imagen {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: var(--color-borde);
        }

        .producto-body {
            padding: 10px;
        }

        .producto-categoria {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--color-acento);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .producto-nombre {
            font-size: 14px;
            font-weight: 600;
            margin: 4px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .producto-precio {
            font-size: 16px;
            font-weight: 700;
            color: var(--color-texto);
        }

        .producto-disponible {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            margin-top: 4px;
        }

        .disp-si {
            background: #d4edda;
            color: #155724;
        }

        .disp-no {
            background: #f8d7da;
            color: #721c24;
        }

        .producto-acciones {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .btn-producto {
            flex: 1;
            padding: 6px;
            border-radius: 6px;
            border: none;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s;
            background: var(--color-fondo);
            color: var(--color-texto);
        }

        .btn-producto:active {
            background: var(--color-borde);
        }

        .btn-producto.qr-btn {
            background: #1a1a2e;
            color: white;
        }

        /* ========== MODALES Y OVERLAYS ========== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .modal {
            background: white;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-titulo {
            font-size: 18px;
            font-weight: 700;
        }

        .btn-cerrar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--color-fondo);
            cursor: pointer;
            font-size: 16px;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ========== FORMULARIOS ========== */
        .form-grupo {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--color-gris);
        }

        .form-input {
            padding: 12px 16px;
            border: 2px solid var(--color-borde);
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-acento);
        }

        textarea.form-input {
            min-height: 80px;
            resize: vertical;
        }

        .btn-primario {
            padding: 14px 24px;
            border-radius: 10px;
            border: none;
            background: var(--color-acento);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primario:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .btn-secundario {
            padding: 14px 24px;
            border-radius: 10px;
            border: 2px solid var(--color-borde);
            background: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ========== IMAGEN UPLOAD CON CÁMARA ========== */
        .imagen-upload {
            border: 2px dashed var(--color-borde);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .imagen-upload img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
        }

        .imagen-opciones {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-imagen {
            padding: 10px 16px;
            border-radius: 8px;
            border: 2px solid var(--color-borde);
            background: white;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            flex: 1;
            justify-content: center;
        }

        .btn-imagen:active {
            background: var(--color-fondo);
        }

        input[type="file"] {
            display: none;
        }

        /* ========== QR MODAL ========== */
        .qr-container {
            text-align: center;
            padding: 20px;
        }

        .qr-container canvas,
        .qr-container img {
            max-width: 250px;
            width: 100%;
            border-radius: 8px;
        }

        .qr-url {
            margin-top: 12px;
            font-size: 12px;
            color: var(--color-gris);
            word-break: break-all;
            background: var(--color-fondo);
            padding: 8px;
            border-radius: 6px;
        }

        /* ========== DETALLE PRODUCTO ========== */
        .detalle-imagen {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: var(--radio-borde);
            background: var(--color-borde);
        }

        .detalle-nombre {
            font-size: 22px;
            font-weight: 700;
            margin-top: 12px;
        }

        .detalle-precio {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-acento);
            margin: 8px 0;
        }

        .detalle-descripcion {
            font-size: 14px;
            line-height: 1.6;
            color: #495057;
        }

        .detalle-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            padding: 10px 16px;
            background: var(--color-fondo);
            border-radius: 8px;
            text-decoration: none;
            color: var(--color-texto);
            font-size: 14px;
        }

        /* ========== TOAST ========== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 25px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            z-index: 300;
            animation: toastIn 0.3s ease;
            text-align: center;
            max-width: 90%;
        }

        .toast-ok { background: #28a745; }
        .toast-error { background: #dc3545; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ========== UTILIDADES ========== */
        .oculto { display: none !important; }
        .texto-centro { text-align: center; }
        .mt-8 { margin-top: 8px; }
        .mt-16 { margin-top: 16px; }
        .gap-8 { gap: 8px; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }

        /* ========== DESKTOP ========== */
        @media (min-width: 768px) {
            .main-container {
                max-width: 600px;
                margin: 0 auto;
            }
            .productos-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }
            .modal {
                border-radius: 20px;
                margin: 20px;
                max-height: 85vh;
            }
            .overlay {
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header" id="header">
        <img class="logo-header" id="logoHeader" src="" alt="Logo" onerror="this.style.display='none'">
        <div class="header-info">
            <div class="header-nombre" id="nombreHeader">Mi Negocio</div>
            <div class="header-eslogan" id="esloganHeader">El mejor servicio</div>
        </div>
        <div class="header-actions">
            <button class="btn-icono" onclick="compartirQR(null)" title="Compartir catálogo">
                <i class="fa-solid fa-qrcode"></i>
            </button>
            <button class="btn-icono" onclick="mostrarLogin()" title="Administrar">
                <i class="fa-solid fa-lock"></i>
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-container" id="mainContainer">
        <!-- Se carga dinámicamente -->
        <div class="texto-centro" style="padding: 40px;">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 32px; color: var(--color-gris);"></i>
            <p style="margin-top: 12px; color: var(--color-gris);">Cargando catálogo...</p>
        </div>
    </div>

    <!-- OVERLAY DETALLE PRODUCTO -->
    <div class="overlay oculto" id="overlayDetalle">
        <div class="modal" id="modalDetalle">
            <div class="modal-header">
                <span class="modal-titulo">Detalle del Producto</span>
                <button class="btn-cerrar" onclick="cerrarDetalle()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="detalleBody"></div>
        </div>
    </div>

    <!-- OVERLAY QR -->
    <div class="overlay oculto" id="overlayQR">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-titulo">Código QR</span>
                <button class="btn-cerrar" onclick="cerrarQR()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="qr-container" id="qrContainer"></div>
        </div>
    </div>

    <!-- OVERLAY LOGIN -->
    <div class="overlay oculto" id="overlayLogin">
        <div class="modal" id="modalLogin">
            <div class="modal-header">
                <span class="modal-titulo">Acceso Administrador</span>
                <button class="btn-cerrar" onclick="cerrarLogin()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="loginBody"></div>
        </div>
    </div>

    <!-- OVERLAY ADMIN PANEL -->
    <div class="overlay oculto" id="overlayAdmin">
        <div class="modal" id="modalAdmin">
            <div class="modal-header">
                <span class="modal-titulo">Panel de Administración</span>
                <button class="btn-cerrar" onclick="cerrarAdmin()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="adminBody" style="gap: 12px;"></div>
        </div>
    </div>

    <!-- OVERLAY FORM PRODUCTO -->
    <div class="overlay oculto" id="overlayFormProducto">
        <div class="modal" id="modalFormProducto">
            <div class="modal-header">
                <span class="modal-titulo" id="tituloFormProducto">Nuevo Producto</span>
                <button class="btn-cerrar" onclick="cerrarFormProducto()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="formProductoBody"></div>
        </div>
    </div>

    <!-- OVERLAY FORM NEGOCIO -->
    <div class="overlay oculto" id="overlayFormNegocio">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-titulo">Editar Negocio</span>
                <button class="btn-cerrar" onclick="cerrarFormNegocio()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="formNegocioBody"></div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast oculto" id="toast"></div>

    <!-- LIBRERÍA QR -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

    <script>
        // ============================================
        // CONFIGURACIÓN
        // ============================================
        const CONFIG = {
            API_URL: 'PEGA_AQUI_TU_URL_DE_APPS_SCRIPT'
        };

        // ============================================
        // ESTADO GLOBAL
        // ============================================
        let estado = {
            negocio: null,
            productos: [],
            token: null,
            adminEmail: null
        };

        // ============================================
        // INICIALIZACIÓN
        // ============================================
        document.addEventListener('DOMContentLoaded', async () => {
            await cargarDatos();
        });

        async function cargarDatos() {
            try {
                const [respNegocio, respCatalogo] = await Promise.all([
                    fetch(`${CONFIG.API_URL}?accion=obtenerNegocio`).then(r => r.json()),
                    fetch(`${CONFIG.API_URL}?accion=obtenerCatalogo`).then(r => r.json())
                ]);

                if (respNegocio.exito) {
                    estado.negocio = respNegocio.negocio;
                    aplicarDatosNegocio();
                }

                if (respCatalogo.exito) {
                    estado.productos = respCatalogo.productos;
                }

                renderizarCatalogo();
            } catch (error) {
                mostrarToast('Error al cargar datos: ' + error.message, 'error');
            }
        }

        function aplicarDatosNegocio() {
            const n = estado.negocio;
            if (!n) return;

            document.getElementById('nombreHeader').textContent = n.nombre || 'Mi Negocio';
            document.getElementById('esloganHeader').textContent = n.eslogan || '';
            
            const logo = document.getElementById('logoHeader');
            if (n.logo_url) {
                logo.src = n.logo_url;
                logo.style.display = '';
            } else {
                logo.style.display = 'none';
            }

            if (n.color_acento) {
                document.documentElement.style.setProperty('--color-acento', n.color_acento);
            }

            renderizarNegocio();
        }

        // ============================================
        // RENDERIZAR SECCIÓN NEGOCIO
        // ============================================
        function renderizarNegocio() {
            const n = estado.negocio;
            if (!n) return;

            const main = document.getElementById('mainContainer');
            
            let html = `
                <div class="negocio-card">
                    ${n.banner_url ? `<img class="banner-img" src="${n.banner_url}" alt="Banner" onerror="this.style.display='none'">` : ''}
                    <div class="negocio-body">
                        <h1 class="negocio-nombre">${n.nombre || 'Mi Negocio'}</h1>
                        ${n.eslogan ? `<p class="negocio-eslogan">${n.eslogan}</p>` : ''}
                        ${n.descripcion ? `<p class="negocio-descripcion">${n.descripcion}</p>` : ''}
                        <div class="info-contacto">
                            ${n.telefono ? `<a class="contacto-item" href="tel:${n.telefono}"><i class="fa-solid fa-phone"></i> ${n.telefono}</a>` : ''}
                            ${n.whatsapp ? `<a class="contacto-item" href="https://wa.me/${n.whatsapp.replace(/[^0-9]/g,'')}" target="_blank"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>` : ''}
                            ${n.email ? `<a class="contacto-item" href="mailto:${n.email}"><i class="fa-solid fa-envelope"></i> ${n.email}</a>` : ''}
                            ${n.direccion ? `<div class="contacto-item"><i class="fa-solid fa-location-dot"></i> ${n.direccion}</div>` : ''}
                            ${n.horario ? `<div class="contacto-item"><i class="fa-solid fa-clock"></i> ${n.horario}</div>` : ''}
                        </div>
                        <div class="redes-sociales">
                            ${n.facebook ? `<a class="btn-red" href="${n.facebook}" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>` : ''}
                            ${n.instagram ? `<a class="btn-red" href="${n.instagram}" target="_blank"><i class="fa-brands fa-instagram"></i></a>` : ''}
                            ${n.sitio_web ? `<a class="btn-red" href="${n.sitio_web}" target="_blank"><i class="fa-solid fa-globe"></i></a>` : ''}
                        </div>
                    </div>
                </div>
                <div class="catalogo-header">
                    <h2 class="catalogo-titulo">Productos</h2>
                    <span style="color: var(--color-gris); font-size: 14px;">${estado.productos.length} producto(s)</span>
                </div>
                <div class="categorias-filtro" id="categoriasFiltro"></div>
                <div class="productos-grid" id="productosGrid"></div>
            `;

            main.innerHTML = html;
            renderizarFiltros();
            renderizarProductos();
        }

        // ============================================
        // RENDERIZAR CATÁLOGO
        // ============================================
        function renderizarCatalogo(filtroCategoria = 'todas') {
            renderizarFiltros(filtroCategoria);
            renderizarProductos(filtroCategoria);
        }

        function renderizarFiltros(filtroActivo = 'todas') {
            const categorias = [...new Set(estado.productos.map(p => p.categoria).filter(Boolean))];
            const container = document.getElementById('categoriasFiltro');
            if (!container) return;

            let html = `<span class="cat-chip ${filtroActivo === 'todas' ? 'activo' : ''}" onclick="renderizarProductos('todas'); actualizarFiltroActivo('todas')">Todas</span>`;
            categorias.forEach(cat => {
                html += `<span class="cat-chip ${filtroActivo === cat ? 'activo' : ''}" onclick="renderizarProductos('${cat.replace(/'/g, "\\'")}'); actualizarFiltroActivo('${cat.replace(/'/g, "\\'")}')">${cat}</span>`;
            });
            container.innerHTML = html;
        }

        function actualizarFiltroActivo(categoria) {
            document.querySelectorAll('.cat-chip').forEach(chip => {
                chip.classList.toggle('activo', chip.textContent === categoria || (categoria === 'todas' && chip.textContent === 'Todas'));
            });
        }

        function renderizarProductos(filtroCategoria = 'todas') {
            const grid = document.getElementById('productosGrid');
            if (!grid) return;

            let productosFiltrados = estado.productos;
            if (filtroCategoria !== 'todas') {
                productosFiltrados = estado.productos.filter(p => p.categoria === filtroCategoria);
            }

            if (productosFiltrados.length === 0) {
                grid.innerHTML = '<p class="texto-centro" style="grid-column: 1/-1; padding: 20px; color: var(--color-gris);">No hay productos en esta categoría</p>';
                return;
            }

            grid.innerHTML = productosFiltrados.map(p => `
                <div class="producto-card" onclick="mostrarDetalle('${p.id}')">
                    ${p.imagen_url ? `<img class="producto-imagen" src="${p.imagen_url}" alt="${p.nombre}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect fill=%22%23ddd%22 width=%22100%22 height=%22100%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22 font-size=%2214%22>Sin imagen</text></svg>'">` : `<div class="producto-imagen" style="display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;">Sin imagen</div>`}
                    <div class="producto-body">
                        <span class="producto-categoria">${p.categoria || ''}</span>
                        <h3 class="producto-nombre">${p.nombre}</h3>
                        ${p.precio ? `<div class="producto-precio">${p.precio}</div>` : ''}
                        <span class="producto-disponible ${p.disponible === 'SI' ? 'disp-si' : 'disp-no'}">${p.disponible === 'SI' ? 'Disponible' : 'No disponible'}</span>
                        <div class="producto-acciones" onclick="event.stopPropagation()">
                            <button class="btn-producto qr-btn" onclick="compartirQR('${p.id}')"><i class="fa-solid fa-qrcode"></i> QR</button>
                            ${p.link_apoyo ? `<a class="btn-producto" href="${p.link_apoyo}" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> Info</a>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ============================================
        // DETALLE PRODUCTO
        // ============================================
        function mostrarDetalle(id) {
            const p = estado.productos.find(prod => prod.id.toString() === id.toString());
            if (!p) return;

            const body = document.getElementById('detalleBody');
            body.innerHTML = `
                ${p.imagen_url ? `<img class="detalle-imagen" src="${p.imagen_url}" alt="${p.nombre}" onerror="this.style.display='none'">` : ''}
                <span class="producto-categoria">${p.categoria || ''}</span>
                <h2 class="detalle-nombre">${p.nombre}</h2>
                ${p.precio ? `<div class="detalle-precio">${p.precio}</div>` : ''}
                <span class="producto-disponible ${p.disponible === 'SI' ? 'disp-si' : 'disp-no'}">${p.disponible === 'SI' ? 'Disponible' : 'No disponible'}</span>
                ${p.descripcion ? `<p class="detalle-descripcion">${p.descripcion}</p>` : ''}
                ${p.link_apoyo ? `<a class="detalle-link" href="${p.link_apoyo}" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> Más información</a>` : ''}
                <div class="flex gap-8 mt-16">
                    <button class="btn-secundario" onclick="compartirQR('${p.id}')"><i class="fa-solid fa-qrcode"></i> Compartir QR</button>
                    <button class="btn-primario" onclick="cerrarDetalle()">Cerrar</button>
                </div>
            `;

            document.getElementById('overlayDetalle').classList.remove('oculto');
        }

        function cerrarDetalle() {
            document.getElementById('overlayDetalle').classList.add('oculto');
        }

        // ============================================
        // COMPARTIR QR
        // ============================================
        function compartirQR(productoId) {
            let url;
            if (productoId) {
                url = `${window.location.origin}${window.location.pathname}?producto=${productoId}`;
            } else {
                url = window.location.href.split('?')[0];
            }

            const container = document.getElementById('qrContainer');
            container.innerHTML = '';

            try {
                const qr = qrcode(0, 'M');
                qr.addData(url);
                qr.make();
                const imgTag = qr.createImgTag(6, 8);
                container.innerHTML = imgTag;
                container.innerHTML += `<div class="qr-url">${url}</div>`;
            } catch (e) {
                container.innerHTML = `<p>Error al generar QR</p><div class="qr-url">${url}</div>`;
            }

            document.getElementById('overlayQR').classList.remove('oculto');
        }

        function cerrarQR() {
            document.getElementById('overlayQR').classList.add('oculto');
        }

        // ============================================
        // LOGIN
        // ============================================
        function mostrarLogin() {
            const body = document.getElementById('loginBody');
            body.innerHTML = `
                <p style="font-size:14px;color:var(--color-gris);">Ingresa tu correo de administrador para recibir un código de acceso.</p>
                <div class="form-grupo">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="admin@ejemplo.com">
                </div>
                <button class="btn-primario" onclick="solicitarCodigo()">Enviar código</button>
                <div id="seccionCodigo" class="oculto" style="display:flex;flex-direction:column;gap:12px;">
                    <div class="form-grupo">
                        <label class="form-label">Código de 6 dígitos</label>
                        <input type="text" class="form-input" id="loginCodigo" placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]*">
                    </div>
                    <button class="btn-primario" onclick="verificarCodigo()">Verificar código</button>
                </div>
            `;
            document.getElementById('overlayLogin').classList.remove('oculto');
        }

        function cerrarLogin() {
            document.getElementById('overlayLogin').classList.add('oculto');
        }

        async function solicitarCodigo() {
            const email = document.getElementById('loginEmail').value.trim();
            if (!email) return mostrarToast('Ingresa tu correo', 'error');

            try {
                const resp = await fetch(`${CONFIG.API_URL}?accion=solicitarCodigo&datos=${encodeURIComponent(JSON.stringify({email}))}`).then(r => r.json());
                if (resp.exito) {
                    document.getElementById('seccionCodigo').classList.remove('oculto');
                    mostrarToast('Código enviado a tu correo', 'ok');
                } else {
                    mostrarToast(resp.error || 'Error al solicitar código', 'error');
                }
            } catch (e) {
                mostrarToast('Error de conexión', 'error');
            }
        }

        async function verificarCodigo() {
            const email = document.getElementById('loginEmail').value.trim();
            const codigo = document.getElementById('loginCodigo').value.trim();
            if (!codigo) return mostrarToast('Ingresa el código', 'error');

            try {
                const resp = await fetch(`${CONFIG.API_URL}?accion=verificarCodigo&datos=${encodeURIComponent(JSON.stringify({email, codigo}))}`).then(r => r.json());
                if (resp.exito) {
                    estado.token = resp.token;
                    estado.adminEmail = email;
                    cerrarLogin();
                    mostrarAdmin();
                    mostrarToast('Acceso concedido', 'ok');
                } else {
                    mostrarToast(resp.error || 'Código incorrecto', 'error');
                }
            } catch (e) {
                mostrarToast('Error de conexión', 'error');
            }
        }

        // ============================================
        // PANEL ADMIN
        // ============================================
        async function mostrarAdmin() {
            if (!estado.token) {
                mostrarLogin();
                return;
            }

            // Verificar sesión
            try {
                const resp = await fetch(`${CONFIG.API_URL}?accion=verificarSesion&datos=${encodeURIComponent(JSON.stringify({token: estado.token}))}`).then(r => r.json());
                if (!resp.exito) {
                    estado.token = null;
                    mostrarLogin();
                    mostrarToast('Sesión expirada', 'error');
                    return;
                }
            } catch (e) {
                mostrarToast('Error al verificar sesión', 'error');
                return;
            }

            const body = document.getElementById('adminBody');
            body.innerHTML = `
                <p style="color:var(--color-gris);font-size:13px;">Sesión: <strong>${estado.adminEmail}</strong></p>
                <button class="btn-primario" onclick="inicializarSheet()"><i class="fa-solid fa-database"></i> Inicializar / Crear pestañas en Sheet</button>

            document.getElementById('overlayAdmin').classList.add('oculto');

        async function cargarListaAdmin() {
            const container = document.getElementById('listaProductosAdmin');
            if (!container) return;

            if (estado.productos.length === 0) {
                container.innerHTML = '<p style="color:var(--color-gris);font-size:13px;">No hay productos</p>';

        // ============================================

        async function inicializarSheet() {
            if (!confirm('¿Crear las pestañas necesarias en el Google Sheet? No se borrarán datos existentes.')) return;

            try {
                const resp = await fetch(`${CONFIG.API_URL}?accion=inicializar`).then(r => r.json());

                    await cargarDatos();
                    mostrarAdmin();

                    mostrarToast(resp.error || 'Error al inicializar', 'error');

        // ============================================
        // FORM NEGOCIO
        // ============================================

            const n = estado.negocio || {};
            const campos = [
                {key: 'nombre', label: 'Nombre del negocio'},
                {key: 'eslogan', label: 'Eslogan'},
                {key: 'descripcion', label: 'Descripción', tipo: 'textarea'},
                {key: 'telefono', label: 'Teléfono'},
                {key: 'whatsapp', label: 'WhatsApp (con código país, ej: +5215512345678)'},
                {key: 'email', label: 'Email'},
                {key: 'direccion', label: 'Dirección'},
                {key: 'horario', label: 'Horario'},
                {key: 'facebook', label: 'Facebook (URL)'},
                {key: 'instagram', label: 'Instagram (URL)'},
                {key: 'sitio_web', label: 'Sitio web (URL)'},
                {key: 'color_acento', label: 'Color acento', tipo: 'color'},
                {key: 'logo_url', label: 'Logo (URL)', tipo: 'imagen'},
                {key: 'banner_url', label: 'Banner (URL)', tipo: 'imagen'}

            campos.forEach(c => {
                if (c.tipo === 'textarea') {

                } else if (c.tipo === 'color') {
                    html += `<div class="form-grupo"><label class="form-label">${c.label}</label><input type="color" class="form-input" id="neg_${c.key}" value="${n[c.key] || '#2196F3'}" style="height:44px;padding:4px;"></div>`;
                } else if (c.tipo === 'imagen') {
                    html += `
                        <div class="form-grupo">
                            <label class="form-label">${c.label}</label>
                            <div class="imagen-upload" id="preview_${c.key}" onclick="document.getElementById('file_${c.key}').click()">
                                ${n[c.key] ? `<img src="${n[c.key]}" alt="Preview">` : '<i class="fa-solid fa-image" style="font-size:32px;color:#ccc;"></i><span style="color:#999;">Toca para seleccionar imagen</span>'}
                            </div>
                            <div class="imagen-opciones" style="margin-top:8px;">
                                <button class="btn-imagen" onclick="event.stopPropagation();document.getElementById('file_${c.key}').click()"><i class="fa-solid fa-folder-open"></i> Galería</button>
                                <button class="btn-imagen" onclick="event.stopPropagation();abrirCamara('file_${c.key}')"><i class="fa-solid fa-camera"></i> Cámara</button>
                            </div>
                            <input type="file" id="file_${c.key}" accept="image/*" onchange="previsualizarImagen(this, 'preview_${c.key}')" style="display:none;">
                            <input type="text" class="form-input mt-8" id="neg_${c.key}" value="${n[c.key] || ''}" placeholder="O pega el enlace directo de la imagen">
                        </div>`;
                } else {
                    html += `<div class="form-grupo"><label class="form-label">${c.label}</label><input type="text" class="form-input" id="neg_${c.key}" value="${n[c.key] || ''}"></div>`;
                }
            });

            html += `<button class="btn-primario" onclick="guardarNegocio()">Guardar cambios</button>`;
            html += `<button class="btn-secundario" onclick="cerrarFormNegocio()">Cancelar</button>`;

            document.getElementById('formNegocioBody').innerHTML = html;
            document.getElementById('overlayFormNegocio').classList.remove('oculto');
        }

        function cerrarFormNegocio() {
            document.getElementById('overlayFormNegocio').classList.add('oculto');
        }

        async function guardarNegocio() {
            const campos = ['nombre', 'eslogan', 'descripcion', 'telefono', 'whatsapp', 'email', 'direccion', 'horario', 'facebook', 'instagram', 'sitio_web', 'logo_url', 'banner_url', 'color_acento'];
            const datos = {};
            campos.forEach(c => {
                const el = document.getElementById('neg_' + c);
                if (el) datos[c] = el.value;
            });

            try {
                const resp = await fetch(`${CONFIG.API_URL}?accion=guardarNegocio&datos=${encodeURIComponent(JSON.stringify({campos: datos, token: estado.token}))}`).then(r => r.json());
                if (resp.exito) {
                    mostrarToast('Datos guardados', 'ok');
                    cerrarFormNegocio();
                    await cargarDatos();
                    if (document.getElementById('overlayAdmin').classList.contains('oculto') === false) mostrarAdmin();
                } else {
                    mostrarToast(resp.error || 'Error al guardar', 'error');
                }
            } catch (e) {
                mostrarToast('Error de conexión', 'error');
            }
        }

                    </div>

        function cerrarFormProducto() {
            document.getElementById('overlayFormProducto').classList.add('oculto');
        }

        async function guardarProducto() {
            const producto = {
                id: document.getElementById('prod_id').value,
                nombre: document.getElementById('prod_nombre').value,
                categoria: document.getElementById('prod_categoria').value,
                precio: document.getElementById('prod_precio').value,
                disponible: document.getElementById('prod_disponible').value,
                descripcion: document.getElementById('prod_descripcion').value,
                link_apoyo: document.getElementById('prod_link_apoyo').value,
                imagen_url: document.getElementById('prod_imagen_url').value
            };

            if (!producto.nombre) return mostrarToast('El nombre es obligatorio', 'error');

            try {
                const resp = await fetch(`${CONFIG.API_URL}?accion=guardarProducto&datos=${encodeURIComponent(JSON.stringify({producto, token: estado.token}))}`).then(r => r.json());
                if (resp.exito) {
                    mostrarToast(producto.id ? 'Producto actualizado' : 'Producto creado', 'ok');
                    cerrarFormProducto();
                    await cargarDatos();
                    if (document.getElementById('overlayAdmin').classList.contains('oculto') === false) mostrarAdmin();
                } else {
                    mostrarToast(resp.error || 'Error al guardar producto', 'error');
                }
            } catch (e) {
                mostrarToast('Error de conexión', 'error');
            }
        }

        async function eliminarProducto(id) {
            if (!confirm('¿Eliminar este producto?')) return;

            try {
                const resp = await fetch(`${CONFIG.API_URL}?accion=eliminarProducto&datos=${encodeURIComponent(JSON.stringify({id, token: estado.token}))}`).then(r => r.json());
                if (resp.exito) {
                    mostrarToast('Producto eliminado', 'ok');
                    await cargarDatos();
                    mostrarAdmin();
                } else {
                    mostrarToast(resp.error || 'Error al eliminar', 'error');
                }
            } catch (e) {
                mostrarToast('Error de conexión', 'error');
            }
        }

        // ============================================
        // MANEJO DE IMÁGENES
        // ============================================
        function abrirCamara(inputId) {
            const input = document.getElementById(inputId);
            input.setAttribute('capture', 'environment');
            input.click();
            input.removeAttribute('capture');
        }

        function previsualizarImagen(inputFile, previewId) {
            const file = inputFile.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById(previewId);
                preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                mostrarToast('Imagen cargada localmente. Para guardar permanentemente, sube la imagen a un servicio de hosting y pega el enlace.', 'ok');
            };
            reader.readAsDataURL(file);
        }

        // ============================================
        // TOAST
        // ============================================
        function mostrarToast(mensaje, tipo = 'ok') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = `toast toast-${tipo}`;
            toast.classList.remove('oculto');
            
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.add('oculto');
            }, 3500);
        }

        // ============================================
        // CERRAR OVERLAYS CON ESC O TAP FUERA
        // ============================================
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('overlay')) {
                e.target.classList.add('oculto');
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.querySelectorAll('.overlay').forEach(o => o.classList.add('oculto'));
            }
        });

        // ============================================
        // VERIFICAR PRODUCTO EN URL
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        const productoUrl = urlParams.get('producto');
        if (productoUrl) {
            setTimeout(() => {
                const p = estado.productos.find(prod => prod.id.toString() === productoUrl);
                if (p) mostrarDetalle(productoUrl);
            }, 1500);
        }
    </script>
